<!doctype html>
<html lang="de">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Haushöd</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@500;600&family=Nunito:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<link rel="icon" type="image/png" href="icons/favicon-64.png">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Haushöd">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="theme-color" content="#FF5A0A">
<style>
:root{
  --paper:#FBF6F3; --surface:#FFFFFF; --ink:#2A1A14; --muted:#7A5F55; --line:#EBDDD5;
  --herb:#D63A0A; --herb-ink:#FFFFFF; --herb-soft:#FFE6D8;
  --grad:linear-gradient(135deg,#FF1E0C 0%,#FF5A0A 55%,#FF9A0A 100%);
  --grad-v:linear-gradient(0deg,#FF2A0E 0%,#FF6A0A 60%,#FFA20F 100%);
  --ok:#23885A; --mustard:#9C6200; --mustard-soft:#FCEBCF;
  --berry:#B0122E; --berry-soft:#FADDE2; --jar:#F4E8E1;
  --radius-s:8px; --radius-m:14px; --radius-l:22px;
  --font:"Nunito", ui-rounded, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  --display:"Fredoka", "Nunito", ui-rounded, system-ui, sans-serif;
  box-sizing:border-box;
  padding-top:env(safe-area-inset-top,0px);
  padding-bottom:env(safe-area-inset-bottom,0px);
  color-scheme:light;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    --paper:#0E0A09; --surface:#1A1311; --ink:#F6ECE7; --muted:#B29A90; --line:#33251F;
    --herb:#FF6A24; --herb-ink:#1A0B05; --herb-soft:#3A1C10;
    --ok:#5CC28B; --mustard:#F2B44A; --mustard-soft:#3A2C14;
    --berry:#FF6B80; --berry-soft:#43202A; --jar:#2A1F1B;
    color-scheme:dark;
  }
}
:root[data-theme="dark"]{
    --paper:#0E0A09; --surface:#1A1311; --ink:#F6ECE7; --muted:#B29A90; --line:#33251F;
    --herb:#FF6A24; --herb-ink:#1A0B05; --herb-soft:#3A1C10;
    --ok:#5CC28B; --mustard:#F2B44A; --mustard-soft:#3A2C14;
    --berry:#FF6B80; --berry-soft:#43202A; --jar:#2A1F1B;
    color-scheme:dark;
}
*,*::before,*::after{box-sizing:inherit}
html{scroll-padding-top:env(safe-area-inset-top,0px);height:100%}
body{margin:0;min-height:100%;background:var(--paper);color:var(--ink);font-family:var(--font);font-size:16px;line-height:1.45;-webkit-tap-highlight-color:transparent}
button,input,select,textarea{font:inherit;color:inherit;box-sizing:border-box}
button{cursor:pointer}
:focus-visible{outline:3px solid var(--herb);outline-offset:2px;border-radius:6px}
.wrap{max-width:640px;margin:0 auto;padding:0 16px}

/* Kopf */
.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);padding:14px 0 8px}
.top-row{display:flex;align-items:baseline;justify-content:space-between;gap:12px}
h1{font-family:var(--display);font-size:32px;line-height:1.1;font-weight:600;letter-spacing:-0.01em;margin:0}
.brand{display:flex;align-items:center;gap:10px;min-width:0}
.brand img{width:38px;height:38px;flex:none}
.top-row{align-items:center}
.sync{font-size:13px;color:var(--muted);white-space:nowrap}
.search{margin-top:12px;width:100%;padding:11px 14px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
.chips{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--line);background:var(--surface);border-radius:999px;padding:6px 12px;font-size:14px}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip.warn{border-color:var(--mustard);color:var(--mustard);background:var(--mustard-soft)}
.chip.warn[aria-pressed="true"]{background:var(--mustard);color:var(--surface)}

main{padding-bottom:150px;overflow-x:hidden;overflow-x:clip}
.group{margin-top:18px}
.group h2{font-size:15px;font-weight:600;color:var(--muted);margin:0 0 6px 2px}
.grouphead{display:flex;align-items:center;gap:6px;width:100%;min-height:36px;margin:-6px 0 -4px -2px;padding:4px 2px;border:0;background:none;font:inherit;color:inherit;text-align:left;cursor:pointer}
.grouphead > span{flex:0 1 auto}
.grouphead small{margin-left:auto;font-weight:500;font-size:13px}
.grouphead small .w{color:var(--mustard)}
.grouphead .chev{flex:none;transition:transform .15s}
.group.shut .grouphead .chev{transform:rotate(-90deg)}
.group.shut{margin-top:6px}
.group.shut h2{margin-bottom:0}
@media (prefers-reduced-motion: reduce){.grouphead .chev{transition:none}}
.stars{display:flex;gap:2px;margin-left:-6px}
.star{border:0;background:none;padding:6px;color:var(--line);cursor:pointer;line-height:0}
.star svg path{fill:currentColor}
.star[aria-pressed="true"]{color:var(--mustard)}
.minrow{display:flex;align-items:center;gap:8px}
.minrow input{flex:1;min-width:0}
.minrow span{color:var(--muted);font-size:14px}
.tagchips{display:flex;flex-wrap:wrap;gap:6px}
.tagchips:not(:empty){margin-bottom:8px}
.chip.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.kid .tabs{display:none}
.kidings{margin:4px 0 0;padding-left:20px;font-size:16px;line-height:1.6}
.lot.member{padding:8px 12px}
.rngrow{display:flex;align-items:center;gap:8px;flex-wrap:nowrap}
.rngrow span{color:var(--muted);font-size:14px;flex:none}
.field .rngrow input[type=number]{width:84px;flex:none;padding:8px 10px}
.field .rngrow select{width:auto;flex:none;padding:8px 6px}
.lot.tagrow .rngrow{flex:none}
.fsum{margin:8px 2px 0}
.linkbtn.inl{display:inline;margin:0 0 0 4px;padding:0;text-align:left}
.btn.quiet.on{color:var(--ink);font-weight:700}
.chip.saved{border-style:dashed}
.rtools{display:flex;align-items:center;justify-content:space-between;gap:10px;margin-top:14px}
.rtools .seg{flex:0 1 auto}
.rtools .seg.mini button{padding:7px 10px;font-size:14px;white-space:nowrap}
.lot.tagrow{padding:8px 12px}
.tagrow .btn{padding:8px 12px;font-size:14px}
.rtags{display:flex;flex-wrap:wrap;gap:4px;margin-top:4px}
.rtags span{font-size:12px;line-height:1;padding:4px 8px;border-radius:999px;background:var(--line);color:var(--ink)}
.list{background:var(--surface);border-radius:var(--radius-m);border:1px solid var(--line);overflow:hidden}

/* Vorratszeile */
.row{display:flex;align-items:center;gap:12px;padding:10px 10px 10px 14px;border-top:1px solid var(--line)}
.row:first-child{border-top:0}
.row-main{flex:1;min-width:0;background:none;border:0;text-align:left;padding:2px 0;display:flex;gap:12px;align-items:center}
.name{font-weight:600;font-size:17px;line-height:1.25;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta{font-size:14px;color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.meta .w{color:var(--mustard);font-weight:500}
.meta .x{color:var(--berry);font-weight:500}
.row.empty .name{color:var(--muted);font-weight:500}

/* Das Glas: Füllstand im Verhältnis zum Mindestbestand */
.jar{flex:none;width:16px;height:38px;border-radius:5px 5px 7px 7px;background:var(--jar);position:relative;overflow:hidden;box-shadow:inset 0 0 0 1.5px var(--line)}
.jar::before{content:"";position:absolute;left:-1px;right:-1px;top:0;height:4px;background:var(--line)}
.jar i{position:absolute;left:0;right:0;bottom:0;background:var(--grad-v);transition:height .35s ease}
.jar.low i{background:var(--berry)}
.jar .mark{position:absolute;left:0;right:0;height:0;border-top:1.5px dashed var(--muted);opacity:.7}

.qbtn{flex:none;width:46px;height:46px;border-radius:50%;border:1.5px solid var(--line);background:var(--surface);font-size:24px;line-height:1;display:grid;place-items:center}
.qbtn:active{background:var(--herb-soft)}
.qbtn{-webkit-user-select:none;user-select:none;-webkit-touch-callout:none;touch-action:manipulation;transition:box-shadow .1s}
.qbtn.hold{box-shadow:0 0 0 5px var(--herb-soft),0 0 0 7px var(--herb);transition:box-shadow .45s ease-in}
.qbtn.openable{border-style:dashed}
.qbtn.add{border-color:var(--herb);color:var(--herb)}
.qrow{padding:8px 12px;gap:8px}
.qrow .btn{padding:8px 12px;font-size:14px}
.qbtn.flag{width:auto;min-width:64px;padding:0 12px;border-radius:999px;font-size:14px;font-weight:600;color:var(--muted)}
.qbtn.flag.low{border-color:var(--mustard);color:var(--mustard)}

.notice{margin-top:16px;padding:12px 14px;border-radius:var(--radius-m);background:var(--mustard-soft);color:var(--ink);font-size:15px}
.emptystate{margin:48px 8px;text-align:left}
.emptystate h2{font-family:var(--display);font-size:24px;line-height:1.2;margin:0 0 8px;font-weight:600;letter-spacing:-0.01em}
.emptystate p{color:var(--muted);margin:0 0 16px;max-width:42ch}

/* Buttons */
.btn{border:0;border-radius:var(--radius-m);padding:13px 18px;font-weight:600;background:var(--herb);color:var(--herb-ink)}
.btn.ghost{background:transparent;color:var(--herb);border:1.5px solid var(--herb)}
.btn.quiet{background:transparent;color:var(--muted);padding:10px 4px;font-weight:500}
.btn.danger{background:transparent;color:var(--berry);padding:10px 4px;font-weight:600}
.btn.block{width:100%}
.btn:disabled{opacity:.45}

.fab{position:fixed;right:max(16px,calc(50% - 304px));bottom:calc(84px + env(safe-area-inset-bottom,0px));width:60px;height:60px;border-radius:20px;border:0;background:var(--grad);color:#fff;font-size:32px;line-height:1;box-shadow:0 6px 18px rgba(255,70,10,.35);z-index:6}

/* Tabs */
.tabs{position:fixed;left:0;right:0;bottom:0;z-index:7;background:var(--surface);border-top:1px solid var(--line);padding-bottom:env(safe-area-inset-bottom,0px)}
.tabs .wrap{display:flex}
.tab{flex:1;border:0;background:none;padding:12px 0 14px;font-size:15px;font-weight:500;color:var(--muted);position:relative}
.tab[aria-current="page"]{color:var(--ink);font-weight:700}
.tab[aria-current="page"]::after{content:"";position:absolute;left:30%;right:30%;top:0;height:3px;border-radius:0 0 3px 3px;background:var(--grad)}
.badge{display:inline-block;min-width:20px;padding:0 6px;margin-left:4px;border-radius:999px;background:var(--berry);color:#fff;font-size:12px;line-height:20px;font-weight:700;vertical-align:1px}

/* Einkauf */
.addbar{display:flex;gap:8px;margin-top:12px}
.sugg{display:flex;gap:6px;overflow-x:auto;padding:10px 0 2px;scrollbar-width:none}
.sugg::-webkit-scrollbar{display:none}
.sugg:empty{display:none}
.chip.sg{display:flex;flex-direction:column;align-items:flex-start;line-height:1.2;padding:7px 12px;font-size:15px}
.chip.sg small{font-size:12px;color:var(--muted)}
.chip.sg.known{border-color:var(--herb);background:var(--herb-soft)}
.addbar input{flex:1;min-width:0;padding:12px 14px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface)}
.srow{display:flex;align-items:center;gap:10px;padding:8px 8px 8px 10px;border-top:1px solid var(--line)}
.srow:first-child{border-top:0}
.check{flex:none;width:34px;height:34px;border-radius:50%;border:2px solid var(--line);background:none;display:grid;place-items:center}
.check svg{opacity:0}
.srow.done .check{background:var(--herb);border-color:var(--herb);color:var(--herb-ink)}
.srow.done .check svg{opacity:1}
.srow.done .name{text-decoration:line-through;color:var(--muted)}
.sinfo{flex:1;min-width:0}
.sinfo .name,.sinfo .meta{white-space:normal;overflow-wrap:break-word;hyphens:auto}
.stepper{flex:none;display:flex;align-items:center;border:1px solid var(--line);border-radius:999px}
.stepper button{width:34px;height:34px;border:0;background:none;font-size:19px;line-height:1}
.stepper span{min-width:46px;text-align:center;font-size:14px;font-variant-numeric:tabular-nums}
.xbtn{flex:none;width:34px;height:34px;border:0;background:none;color:var(--muted);font-size:20px;border-radius:50%}
.finish{position:fixed;left:0;right:0;bottom:calc(58px + env(safe-area-inset-bottom,0px));z-index:6;padding:10px 0}
.finish .btn{box-shadow:0 6px 18px rgba(255,70,10,.28)}

/* Mehr */
.card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius-m);padding:16px;margin-top:16px}
.card h2{font-family:var(--display);font-size:19px;margin:0 0 4px;font-weight:600}
.card p{margin:0 0 12px;color:var(--muted);font-size:15px}
.login{position:fixed;inset:0;z-index:40;background:var(--paper);display:grid;place-items:center;padding:24px}
.login[hidden]{display:none}
.login-inner{max-width:340px;width:100%;text-align:center}
.login-inner img{width:140px;height:140px;display:block;margin:0 auto}
.login-inner .wordmark{display:block}
.code-in::placeholder{letter-spacing:normal;font-size:17px;font-weight:400}
.login-inner .wordmark{font-family:var(--display);font-size:40px;font-weight:600;margin:8px 0 6px}
.login-inner p{color:var(--muted);margin:0 0 22px}
.login-inner .hint{margin-top:14px}
.setup-in{width:100%;padding:13px 14px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);margin-bottom:10px;font-size:17px}
.code-in{text-align:center;font-size:24px;letter-spacing:.35em;font-variant-numeric:tabular-nums;font-weight:700}
.or{display:flex;align-items:center;gap:10px;color:var(--muted);margin:16px 0;font-size:14px}
.or::before,.or::after{content:"";flex:1;border-top:1px solid var(--line)}
.hhcode{font-family:var(--display);font-size:34px;font-weight:600;letter-spacing:.12em;margin:4px 0 10px;font-variant-numeric:tabular-nums}
.about{display:flex;align-items:center;gap:16px}
.about img{width:72px;height:72px;flex:none}
.about p{margin:2px 0 0}
.wordmark{font-size:28px!important;background:var(--grad);-webkit-background-clip:text;background-clip:text;color:transparent;display:inline-block}
.stats{display:flex;gap:24px;margin:8px 0 4px}
.stat b{display:block;font-size:30px;line-height:1.1;font-weight:700;font-variant-numeric:tabular-nums}
.stat span{font-size:14px;color:var(--muted)}
textarea{width:100%;min-height:140px;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper);resize:vertical}
.btnrow{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* Sheet */
.backdrop{position:fixed;inset:0;background:rgba(10,20,20,.38);z-index:20;opacity:0;pointer-events:none;transition:opacity .2s}
.backdrop.open{opacity:1;pointer-events:auto}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:21;transform:translateY(105%);visibility:hidden;transition:transform .25s ease,visibility 0s linear .25s;pointer-events:none}
.sheet.open{transform:none;visibility:visible;transition:transform .25s ease;pointer-events:auto}
.sheet-inner{max-width:640px;margin:0 auto;background:var(--surface);border-radius:var(--radius-l) var(--radius-l) 0 0;max-height:min(88vh,88dvh);overflow-y:auto;padding:8px 18px calc(22px + env(safe-area-inset-bottom,0px))}
.grip{width:40px;height:5px;border-radius:3px;background:var(--line);margin:4px auto 10px}
.sheet-head{display:flex;gap:10px;align-items:center}
.sheet-head input{flex:1;min-width:0;font-size:24px;font-weight:700;border:0;border-bottom:2px solid var(--line);background:none;padding:6px 2px;border-radius:0}
.sheet-head input:focus{outline:none;border-bottom-color:var(--herb)}
.field{margin-top:18px}
.field > label,.field > .lbl{display:block;font-size:14px;font-weight:600;color:var(--muted);margin-bottom:6px}
.field select,.field input[type=text],.field input[type=number]{width:100%;padding:10px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper)}
.hint{font-size:13px;color:var(--muted);margin-top:4px}
.two{display:grid;grid-template-columns:minmax(0,1fr) minmax(0,1fr);gap:12px}
.two > *{min-width:0}
.field input,.field select{max-width:100%;min-width:0}
details{margin-top:20px;border-top:1px solid var(--line);padding-top:12px}
summary{font-weight:600;cursor:pointer;padding:4px 0}
.seg{display:flex;border:1px solid var(--line);border-radius:var(--radius-s);overflow:hidden}
.seg button{flex:1;border:0;background:var(--paper);padding:10px 6px;font-size:14px}
.seg button[aria-pressed="true"]{background:var(--ink);color:var(--paper);font-weight:600}
.qtyrow{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.sizein{flex:1;min-width:110px;max-width:180px;padding:9px 12px;border:1px solid var(--line);border-radius:var(--radius-s);background:var(--paper)}
.seg.mini button{padding:6px 4px;font-size:13px}
.pick-title{font-family:var(--display);flex:1;font-size:24px;margin:6px 0;font-weight:600}
.picks{display:grid;gap:10px;margin:16px 0 4px}
.picks .btn{display:flex;justify-content:space-between;align-items:center;font-size:19px;padding:14px 18px}
.picks small{font-size:14px;font-weight:500;color:var(--muted)}
.stockbox{margin-top:16px;background:var(--paper);border-radius:var(--radius-m);padding:12px}
.lot{display:flex;align-items:center;gap:8px;padding:8px 0;border-top:1px solid var(--line);font-size:15px}
.lot:first-of-type{border-top:0}
.lot .l{flex:1;min-width:0}
.lot small{display:block;color:var(--muted);font-size:13px}
.reasons{display:flex;flex-wrap:wrap;gap:6px;padding:4px 0 10px}
.reasons .chip{border-color:var(--berry);color:var(--berry)}
.sumline{display:flex;justify-content:space-between;align-items:baseline;gap:8px;margin-bottom:6px}
.sumline b{font-size:20px}
.actions{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px;align-items:center}
.sheet-foot{display:flex;justify-content:space-between;align-items:center;gap:12px;margin-top:22px}

/* Kochen */
.day{margin-top:12px}
.dayhead{display:flex;align-items:center;justify-content:space-between;margin:0 2px 6px}
.dayhead h2{font-size:15px;font-weight:600;color:var(--muted);margin:0}
.day.today .dayhead h2{color:var(--ink);font-weight:700}
.weekhead{font-size:13px;font-weight:600;color:var(--muted);margin:26px 2px 0;padding-top:12px;border-top:1px solid var(--line)}
.addmeal{width:34px;height:34px;border-radius:50%;border:1.5px dashed var(--line);background:none;color:var(--muted);font-size:20px;line-height:1}
.meal{display:flex;gap:12px;align-items:center;width:100%;text-align:left;background:none;border:0;border-top:1px solid var(--line);padding:12px 14px}
.meal:first-child{border-top:0}
.minfo{min-width:0;display:flex;flex-direction:column}
.minfo .meta{white-space:normal}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)}
.dot.miss{background:var(--berry)}
.dot.chk{background:var(--mustard)}
.wrow{display:flex;align-items:center;gap:4px;padding:4px 10px 4px 4px;border-top:1px solid var(--line)}
.wrow:first-child{border-top:0}
.wrow .row-main{padding:8px 0}
.wrow .minfo .meta{white-space:normal}
.vote{flex:none;display:flex;flex-direction:column;align-items:center;width:40px}
.vote b{font-size:15px;line-height:1.1;font-variant-numeric:tabular-nums}
.vbtn{border:0;background:none;width:38px;height:28px;padding:0;color:var(--muted);display:grid;place-items:center;border-radius:8px}
.vbtn[aria-pressed="true"]{color:var(--herb);background:var(--herb-soft)}
.vbtn.down[aria-pressed="true"]{color:var(--berry);background:var(--berry-soft)}
.ingline small.chk,.ingline small .chk{color:var(--mustard)}
.ingline small .ok{color:var(--ok)}
.ingline small .miss{color:var(--berry)}
.ingline > span{flex:1 0 38%;min-width:0}
.ingline > small,.ingline > .ingright{flex:0 1 auto}
.ingstat .ok{color:var(--ok)}
.ingstat .miss{color:var(--berry)}
.ingstat .chk{color:var(--mustard)}
.meal.cooked .name{text-decoration:line-through;color:var(--muted)}
.ingprev{margin-top:8px}
.sheet-inner.sub{position:absolute;left:0;right:0;bottom:0;z-index:2;box-shadow:0 -10px 40px rgba(0,0,0,.25)}
.sheet-inner.sub[hidden]{display:none}
.ingright{display:flex;flex-direction:column;align-items:flex-end;min-width:0}
.ingstat{border:0;background:none;padding:2px 0;margin:-2px 0;font:inherit;font-size:13px;color:var(--muted);text-align:right;cursor:pointer;border-radius:6px}
.ingstat:hover .chev-r,.ingstat:focus-visible .chev-r{color:var(--ink)}
.ingstat .chev-r{font-size:16px;line-height:1;color:var(--line);margin-left:2px}
.linkbtn{display:block;margin-left:auto;margin-top:2px;padding:2px 0;border:0;background:none;font:inherit;color:var(--muted);text-decoration:underline;text-underline-offset:2px;cursor:pointer;text-align:right}
.ingline{display:flex;justify-content:space-between;align-items:baseline;gap:12px;padding:7px 0;border-top:1px solid var(--line);font-size:15px}
.ingline:first-child{border-top:0}
.ingline small{color:var(--muted);text-align:right;font-size:13px}
.ingline small.ok{color:var(--ok)}
.ingline small.miss{color:var(--berry)}
.daychips{display:flex;flex-wrap:wrap;gap:6px}
.steps{white-space:pre-wrap;margin:0;font-size:15px;line-height:1.55}
.sheet textarea{min-height:0;background:var(--paper)}

/* Snackbar */
.snack{position:fixed;left:50%;bottom:calc(150px + env(safe-area-inset-bottom,0px));transform:translate(-50%,20px);z-index:30;background:var(--ink);color:var(--paper);border-radius:var(--radius-m);padding:10px 10px 10px 16px;display:flex;align-items:center;gap:12px;max-width:calc(100% - 32px);width:max-content;opacity:0;pointer-events:none;transition:opacity .2s,transform .2s;font-size:15px}
.snack.show{opacity:1;transform:translate(-50%,0);pointer-events:auto}
.snack{touch-action:pan-y;-webkit-user-select:none;user-select:none}
.snack.drag{transition:none}
.snack button{border:0;background:none;color:#FF8A3D;font-weight:700;padding:6px 8px}
:root[data-theme="dark"] .snack button{color:#C2410C}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]) .snack button{color:#C2410C}}
/* Scanner */
.searchrow{display:flex;gap:8px;margin-top:12px}
.searchrow .search{margin-top:0;flex:1;min-width:0}
.iconbtn{flex:none;width:46px;border:1px solid var(--line);border-radius:var(--radius-m);background:var(--surface);color:var(--ink);display:grid;place-items:center;padding:0}
.cam{position:relative;margin-top:12px;border-radius:var(--radius-m);overflow:hidden;background:#000;width:100%;aspect-ratio:4/3;max-height:42vh}
.cam video{width:100%;height:100%;object-fit:cover;display:block}
.cam-frame{position:absolute;left:7%;right:7%;top:20%;bottom:20%;border:2.5px solid rgba(255,255,255,.85);border-radius:12px;box-shadow:0 0 0 999px rgba(0,0,0,.3);transition:border-color .15s}
.cam.hit .cam-frame{border-color:#5CC28B}
.cam-msg{position:absolute;left:12px;right:12px;bottom:12px;color:#fff;font-size:14px;text-align:center;text-shadow:0 1px 3px rgba(0,0,0,.7)}
.cam-msg:empty{display:none}
.cam-torch{position:absolute;top:10px;right:10px;border:0;border-radius:999px;background:rgba(0,0,0,.5);color:#fff;padding:6px 12px;font-size:14px;font-weight:600}
.cam-torch[aria-pressed="true"]{background:#fff;color:#000}
.switch{display:flex;align-items:center;gap:10px;margin-top:18px;font-weight:600;cursor:pointer}
.switch input{appearance:none;-webkit-appearance:none;flex:none;width:44px;height:26px;border-radius:999px;background:var(--line);position:relative;margin:0;transition:background .2s;cursor:pointer}
.switch input::after{content:"";position:absolute;top:3px;left:3px;width:20px;height:20px;border-radius:50%;background:#fff;box-shadow:0 1px 3px rgba(0,0,0,.25);transition:transform .2s}
.switch input:checked{background:var(--herb)}
.switch input:checked::after{transform:translateX(18px)}
.scanbox{margin-top:12px;background:var(--paper);border-radius:var(--radius-m);padding:12px}
.scanbox p{margin:0 0 8px}
.scanbox .sumline .hint{margin:0;font-variant-numeric:tabular-nums}
.sr{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0);white-space:nowrap}
@keyframes in-r{from{opacity:.3;transform:translateX(36px)}to{opacity:1;transform:none}}
@keyframes in-l{from{opacity:.3;transform:translateX(-36px)}to{opacity:1;transform:none}}
#view.in-r{animation:in-r .2s ease-out}
#view.in-l{animation:in-l .2s ease-out}
@media (prefers-reduced-motion:reduce){*{transition:none!important;animation:none!important}}
</style>
</head>

const UNIT_BY_TERM = {};
for (const [u, list] of Object.entries(UNIT_HINTS)) for (const t of list.split('|')) UNIT_BY_TERM[t] = u;
const termUnit = e => UNIT_BY_TERM[e.t] || CAT_UNIT[e.cat] || 'Stk';
const isLetter = c => !!c && /[a-zäöüßéèêàâçî]/.test(c);
function builtinGuess(name){
  const n = norm(name); let best = null, bestScore = 0;
  for (const e of DICT_TERMS) {
    let i = n.indexOf(e.t);
    while (i !== -1) {
      const j = i + e.t.length; let k = j;
      while (k < n.length && isLetter(n[k])) k++;
      const nearEnd = k - j <= 2;             // Wortende, Pluralendung erlaubt (Kekse, Gurken)
      let ok = true;
      if (e.whole && (isLetter(n[i-1]) || k !== j)) ok = false;
      if (e.end && !nearEnd) ok = false;
      if (ok) { const score = (e.prio ? 5000 : 0) + (nearEnd ? 1000 : 0) + e.t.length; if (score > bestScore) { bestScore = score; best = e; } }
      i = n.indexOf(e.t, i + 1);
    }
  }
  return best ? {cat: best.cat, loc: best.loc, mode: best.mode, unit: termUnit(best)} : {cat: '', loc: '', mode: 'count', unit: ''};
}
/* Gelerntes: was ihr selbst eingestellt habt, schlägt die eingebaute Liste.
   1. exakt gleicher Name, 2. der neue Name enthält einen gelernten Namen
   („Kokosmilch light“ enthält „Kokosmilch“), 3. gemeinsames markantes Wort. */
const STOP = new Set(['bio','light','frisch','groß','gross','klein','mini','vegan','classic','original','packung','flasche','dose','stück','extra','fein','natur','zero','sorte','marke','premium','family']);
const tokens = s => norm(s).split(/[^a-zäöüß0-9]+/).filter(t => t.length >= 4 && !STOP.has(t));
function learnedGuess(name){
  const n = norm(name); if (n.length < 3) return null;
  // Bestehende Artikel zählen auch als gelernt (z. B. alles, was vor dieser Funktion angelegt wurde)
  const L = {};
  for (const x of Object.values(S.articles)) L[norm(x.name)] = {label: x.name, cat: x.cat, loc: x.loc, mode: x.mode, openable: !!x.openable, openCheckDays: x.openCheckDays || null, openMaxDays: x.openMaxDays || null};
  Object.assign(L, S.meta.learned || {});
  if (L[n]) return {...L[n], from: L[n].label};
  const nt = tokens(n);
  let best = null, bestScore = 0;
  for (const [k, v] of Object.entries(L)) {
    let score = 0;
    if (k.length >= 4 && n.includes(k)) score = 100 + k.length;
    else if (nt.length) { const kt = tokens(k); const common = nt.filter(t => kt.includes(t)); if (common.length) score = 10 + common.join('').length; }
    if (score > bestScore) { bestScore = score; best = {...v, from: v.label}; }
  }
  return best;
}
function guess(name){
  const b = builtinGuess(name), l = learnedGuess(name);
  if (!l) return b;
  return {cat: l.cat || b.cat, loc: l.loc || b.loc, mode: l.mode || b.mode, unit: l.unit || b.unit, from: l.from, openable: !!l.openable, openCheckDays: l.openCheckDays || null, openMaxDays: l.openMaxDays || null};
}
function learn(a){
  const k = norm(a.name); if (!k) return;
  const L = S.meta.learned || (S.meta.learned = {});
  const entry = {label: a.name.trim(), cat: a.cat || '', loc: a.loc || '', mode: a.mode || 'count', unit: a.unit || ''};
  if (a.openable) Object.assign(entry, {openable: true, openCheckDays: a.openCheckDays || null, openMaxDays: a.openMaxDays || null});
  const prev = L[k];
  if (prev && JSON.stringify(prev) === JSON.stringify(entry)) return;
  L[k] = entry;
  const keys = Object.keys(L); if (keys.length > 1500) delete L[keys[0]];
  saveMeta();
}

const EL_TERMS = EL_TABLE.flatMap(([g, list]) => list.split('|').map(t => ({t, g}))).sort((x, y) => y.t.length - x.t.length);
const normEl = s => ' ' + norm(s).replace(/[,.;:()\/'’\-–+&]/g, ' ').replace(/\s+/g, ' ').trim() + ' ';

/* ============ Speicher-Schicht ============
   Nur dieser Abschnitt weiß, WO die Daten liegen: Firestore (Haushalt) plus Zwischenspeicher im Browser. */
const LS_KEY = 'haushoed:cache';
/* Abgleich nur der Änderungen. Jeder Schreibvorgang setzt updated auf die Serverzeit (nicht die Uhr des Handys,
   die falsch gehen kann). SYNC merkt sich pro Sammlung den neuesten Zeitstempel, den dieses Gerät vom Server
   gesehen hat; beim Start wird nur gelesen, was ab da geändert wurde. SYNC liegt im selben Zwischenspeicher wie
   die Daten: Fehlt der Zwischenspeicher, fehlt auch SYNC, und es wird alles gelesen.
   Gelöschtes bleibt als Markierung {_del: true} stehen, damit andere Geräte davon erfahren; nach TOMB_KEEP wird
   es beim vollständigen Abgleich endgültig gelöscht. Alle FULL_EVERY liest jedes Gerät einmal alles, als Netz für
   Sonderfälle (etwa ein Gerät mit alter App-Version, das noch ohne Zeitstempel schreibt). */
let SYNC = null;   // {hid, full: ms (Uhr dieses Geräts), since: {Sammlung: ms (Serverzeit)}}
const FULL_EVERY = 3 * 864e5, TOMB_KEEP = 30 * 864e5;
function localLoad(){
  try {
    const raw = localStorage.getItem(LS_KEY);
    if (raw) { const d = JSON.parse(raw); S = {articles:d.articles||{}, shopping:d.shopping||{}, log:d.log||{}, recipes:d.recipes||{}, plan:d.plan||{}, wishes:d.wishes||{}, meta:{...clone(DEFAULT_META), ...(d.meta||{})}}; SYNC = d._sync || null; }
  } catch(e) {}
}
let saveTimer;
/* Der Zwischenspeicher im Browser fasst je nach Browser etwa 5 MB. Wird er knapp, wird zuerst der Verlauf
   weggelassen (der größte Teil), reicht auch das nicht, wird der Zwischenspeicher ganz abgeschaltet.
   Die Daten bleiben in Firestore und dessen eigenem Gerätespeicher vollständig erhalten. */
const STORE = {state: 'ok', warned: false};
function localSave(){
  clearTimeout(saveTimer);
  saveTimer = setTimeout(() => {
    let st = 'ok';
    try { localStorage.setItem(LS_KEY, JSON.stringify({...S, _sync: SYNC})); }
    catch(e) {
      // Ohne Verlauf gespeichert: der Verlauf muss beim nächsten Start vollständig gelesen werden
      const sy = SYNC && {...SYNC, since: {...SYNC.since}}; if (sy) delete sy.since.log;
      try { localStorage.setItem(LS_KEY, JSON.stringify({...S, log: {}, _sync: sy})); st = 'partial'; }
      catch(e2) { try { localStorage.removeItem(LS_KEY); } catch(e3) {} st = 'full'; }
    }
    if (st === STORE.state) return;
    STORE.state = st;
    if (st !== 'ok' && !STORE.warned) { STORE.warned = true; toast('Der Speicher auf diesem Gerät wird knapp. Deine Daten sind trotzdem sicher, Details unter „Mehr“.'); }
    if (UI.tab === 'more') render();
  }, 150);
}

const R = {home:null, active:false};
const pending = new Map(), running = new Set();
function schedule(key, op){ pending.set(key, op); if (!running.has(key)) runQueue(key); }
async function runQueue(key){
  running.add(key);
  while (pending.has(key)) {
    const op = pending.get(key); pending.delete(key);
    try { await op(); } catch(e) { await remoteError(e, op); }
  }
  running.delete(key);
}
async function remoteError(e, op){
  const code = e && e.code;
  if (code === 'unavailable') { await new Promise(r => setTimeout(r, 700 + Math.random()*900)); try { await op(); return; } catch(e2) {} }
  if (code === 'permission-denied') { R.active = false; setSync('local'); toast('Keine Berechtigung zum Speichern'); }
  else if (code === 'resource-exhausted') toast('Das Tageslimit von Firebase ist erreicht. Ab etwa 9 Uhr früh geht es wieder.');
  console.warn('Speichern fehlgeschlagen', e);
}
const stamp = () => window.HFB.serverTimestamp();
function remotePut(col, id, data){ if (!R.active) return; const ref = R.home.collection(col).doc(id); const body = clone(data); delete body._del; schedule(col+'/'+id, () => ref.set({...body, updated: stamp()})); }
// Nicht wirklich löschen, sondern markieren: so erfahren auch Geräte davon, die nur Änderungen abholen
function remoteDel(col, id){ if (!R.active) return; const ref = R.home.collection(col).doc(id); schedule(col+'/'+id, () => ref.set({id, _del: true, updated: stamp()})); }
function remoteUpdate(col, id, fields){
  if (!R.active) return;
  const ref = R.home.collection(col).doc(id);
  schedule(col+'/'+id+'#u'+Object.keys(fields).join(','), async () => {
    try { await ref.update({...fields, updated: stamp()}); }
    catch(e) { if (e && e.code === 'not-found' && S[col][id]) await ref.set({...clone(S[col][id]), updated: stamp()}); else throw e; }
  });
}
// Endgültig löschen: nur für alte Lösch-Markierungen
function remotePurge(col, id){ if (!R.active) return; const ref = R.home.collection(col).doc(id); schedule(col+'/'+id+'#purge', () => ref.delete()); }
function remoteMeta(){ if (!R.active) return; const body = clone(S.meta); schedule('meta', () => R.home.set(body)); }

// Dokumente, die dieses Gerät gerade selbst schreibt: deren lokaler Stand gilt
function busyIds(col){
  const ids = new Set();
  for (const key of new Set([...pending.keys(), ...running])) if (key.startsWith(col + '/')) ids.add(key.slice(col.length + 1).split('#')[0]);
  return ids;
}
/* Einen Stand vom Server einarbeiten. replace = vollständiger Stand der Sammlung (was fehlt, ist weg),
   sonst nur dazumischen (Änderungen seit dem letzten Abgleich). Eigene, noch nicht bestätigte Schreibvorgänge
   gelten vor dem Server. Nur Stände direkt vom Server (nicht aus dem Gerätespeicher) rücken SYNC weiter. */
function applySnap(col, sn, replace){
  const busy = busyIds(col);
  const next = replace ? {} : {...S[col]};
  if (replace) for (const k of busy) if (S[col][k]) next[k] = S[col][k];
  let max = SYNC && SYNC.since[col] != null ? SYNC.since[col] : null;
  for (const d of sn.docs) {
    if (d.pending || busy.has(d.id)) continue;
    const o = d.data();
    if (!sn.fromCache && typeof o.updated === 'number') max = Math.max(max || 0, o.updated);
    if (o._del) {
      delete next[d.id];
      if (replace && !sn.fromCache && typeof o.updated === 'number' && Date.now() - o.updated > TOMB_KEEP) remotePurge(col, d.id);
      continue;
    }
    next[d.id] = clone(o);
  }
  S[col] = next;
  if (!sn.fromCache && SYNC) SYNC.since[col] = max || 0;
}
/* Firestore-Anbindung: bildet die bisherige Schnittstelle (doc/collection/get/set/onSnapshot) nach,

const HH = {id: null, data: null};
const waitFirebase = () => new Promise(res => window.HFB ? res() : window.addEventListener('hfb-ready', res, {once: true}));
function fsHome(F, hid){
  const hdoc = F.doc(F.db, 'households', hid);
  // Serverzeit als Millisekunden; Dokumente mit noch ausstehenden eigenen Schreibvorgängen werden markiert
  const plain = o => { if (o && o.updated && typeof o.updated.toMillis === 'function') o.updated = o.updated.toMillis(); return o; };
  const wrapQS = qs => ({empty: qs.empty, fromCache: qs.metadata.fromCache, docs: qs.docs.map(d => ({id: d.id, pending: !!d.metadata.hasPendingWrites, data: () => plain(d.data())}))});
  const wrapH = sn => { const d = sn.exists() ? sn.data() : null; HH.data = d; return {exists: !!(d && d.meta), fromCache: sn.metadata.fromCache, data: () => d.meta}; };
  return {
    get: async () => wrapH(await F.getDoc(hdoc)),
    set: meta => F.updateDoc(hdoc, {meta}),
    update: fields => F.updateDoc(hdoc, fields),
    onSnapshot: (cb, err) => F.onSnapshot(hdoc, sn => { cb(wrapH(sn)); render(); }, err),
    collection: c => {
      const col = F.collection(hdoc, c);
      return {
        get: async () => wrapQS(await F.getDocs(col)),
        onSnapshot: (cb, err) => F.onSnapshot(col, qs => cb(wrapQS(qs)), err),
        // since = null: die ganze Sammlung; sonst nur, was ab dieser Serverzeit geschrieben wurde
        listen: (since, cb, err) => F.onSnapshot(since == null ? col : F.query(col, F.where('updated', '>=', F.Timestamp.fromMillis(since))), qs => cb(wrapQS(qs)), err),
        doc: id => ({set: body => F.setDoc(F.doc(col, id), body), update: body => F.updateDoc(F.doc(col, id), body), delete: () => F.deleteDoc(F.doc(col, id))})
      };
    }
  };
}
const newCode = () => String(crypto.getRandomValues(new Uint32Array(1))[0] % 1000000).padStart(6, '0');
const fmtCode = c => String(c || '').replace(/^(\d{3})(\d{3})$/, '$1 $2');
async function findHousehold(F, uid){
  const qs = await F.getDocs(F.query(F.collection(F.db, 'households'), F.where('members', 'array-contains', uid)));
  const ids = qs.docs.map(d => d.id), saved = localStorage.getItem('haushoed:hid');
  const hid = saved && ids.includes(saved) ? saved : ids[0] || null;
  if (hid) localStorage.setItem('haushoed:hid', hid);
  return hid;
}
// Neuer Haushalt + Code in einem Schritt; ist der Code zufällig vergeben, wird ein anderer gewürfelt
async function createHousehold(F, uid, name){
  for (let i = 0; i < 6; i++) {
    const code = newCode(), href = F.doc(F.collection(F.db, 'households'));
    const b = F.writeBatch(F.db);
    b.set(href, {members: [uid], inviteCode: code, names: {[uid]: name}, created: Date.now()});
    b.set(F.doc(F.db, 'codes', code), {hid: href.id});
    try { await b.commit(); localStorage.setItem('haushoed:hid', href.id); return href.id; }
    catch(e) { if (!(e && e.code === 'permission-denied')) throw e; }
  }
  throw new Error('Kein freier Code gefunden');
}
async function joinHousehold(F, uid, code, name){
  const c = await F.getDoc(F.doc(F.db, 'codes', code));
  if (!c.exists()) return null;
  const hid = c.data().hid;
  await F.updateDoc(F.doc(F.db, 'households', hid), {members: F.arrayUnion(uid), joinCode: code, ['names.' + uid]: name});
  localStorage.setItem('haushoed:hid', hid);
  return hid;
}
async function renewCode(){
  const F = window.HFB, old = HH.data && HH.data.inviteCode;
  for (let i = 0; i < 6; i++) {
    const code = newCode(), b = F.writeBatch(F.db);
    b.update(F.doc(F.db, 'households', HH.id), {inviteCode: code});
    b.set(F.doc(F.db, 'codes', code), {hid: HH.id});
    if (old) b.delete(F.doc(F.db, 'codes', old));
    try { await b.commit(); toast('Neuer Code: ' + fmtCode(code) + '. Der alte gilt nicht mehr.'); return; }
    catch(e) { if (!(e && e.code === 'permission-denied')) { toast('Code konnte nicht erneuert werden'); return; } }
  }
}
/* Start: Jede Sammlung bekommt eine Live-Verbindung. Ist der Zwischenspeicher aktuell (selber Haushalt, letzter
   vollständiger Abgleich jünger als FULL_EVERY), holt sie nur die Änderungen seit SYNC.since, sonst alles.
   Bis alle ihren ersten Stand geliefert haben, wird nur der jeweils neueste gemerkt; danach laufen Änderungen
   über dieselben Verbindungen ein (jede Änderung kostet einen Lesezugriff). */
async function startHousehold(F, hid){
  HH.id = hid;
  const home = fsHome(F, hid);
  R.home = home;
  const fresh = !!(SYNC && SYNC.hid === hid && SYNC.since && Date.now() - (SYNC.full || 0) < FULL_EVERY);
  if (!fresh) SYNC = {hid, full: null, since: {}};
  const mode = {}, replaced = {};
  for (const c of COLS) mode[c] = fresh && SYNC.since[c] != null ? 'delta' : 'full';
  R.syncMode = mode;
  const take = (c, sn) => {
    const rep = mode[c] === 'full' && !replaced[c] && !sn.fromCache;
    applySnap(c, sn, rep);
    if (rep) replaced[c] = true;
    if (!fresh && !SYNC.full && COLS.every(k => replaced[k])) SYNC.full = Date.now();
  };
  const first = {}, need = ['home', ...COLS];
  let inited = false, ok, fail;
  const ready = new Promise((res, rej) => { ok = res; fail = rej; });
  const check = () => { if (need.every(k => first[k])) ok(); };
  const onErr = e => {
    console.warn(e);
    if (!inited) { fail(e); return; }
    if (e && e.code === 'permission-denied') { R.active = false; setSync('local'); toast('Kein Zugriff mehr auf diesen Haushalt'); }
  };
  home.onSnapshot(sn => {
    if (!inited) { first.home = sn; check(); return; }
    if (sn.exists && !pending.has('meta') && !running.has('meta')) { S.meta = {...clone(DEFAULT_META), ...clone(sn.data())}; localSave(); render(); }
  }, onErr);
  for (const c of COLS) home.collection(c).listen(mode[c] === 'delta' ? SYNC.since[c] : null, sn => {
    if (!inited) { first[c] = sn; check(); return; }
    take(c, sn); localSave(); render();
  }, onErr);
  await ready;
  const hs = first.home, snaps = COLS.map(c => first[c]);
  R.active = true;
  // Nur hochladen, wenn der Server selbst „leer“ gesagt hat, nicht ein leerer Zwischenspeicher
  // (und nur beim vollständigen Abgleich: ein leerer Änderungs-Stand ist ja der Normalfall)
  const remoteEmpty = !fresh && !hs.exists && snaps.every(x => x.empty) && ![hs, ...snaps].some(x => x.fromCache);
  const localHas = Object.keys(S.articles).length + Object.keys(S.shopping).length + Object.keys(S.recipes).length > 0;
  if (remoteEmpty && localHas) {
    remoteMeta();
    for (const c of COLS) { for (const [k, v] of Object.entries(S[c])) remotePut(c, k, v); SYNC.since[c] = 0; replaced[c] = true; }
    SYNC.full = Date.now();
    localSave();
  } else {
    if (hs.exists) S.meta = {...clone(DEFAULT_META), ...clone(hs.data())};
    COLS.forEach((c, i) => take(c, snaps[i]));
    localSave();
    migrate();
  }
  inited = true;
  setSync('cloud'); render();
  housekeeping();
}
async function initRemote(){

  $('#loginLogo').src = document.querySelector('.brand img').src;
  const urlCode = (new URLSearchParams(location.search).get('code') || '').replace(/\D/g, '');
  if (urlCode.length === 6) $('#setupCode').value = urlCode;
  const showSetup = () => {
    login.hidden = false; box.hidden = false; hint.textContent = 'Den Code findest du auf einem Gerät, das schon dabei ist, unter „Mehr“.';
    $('#loginText').textContent = 'Tritt mit dem Code eures Haushalts bei oder leg einen neuen an.';
    setTimeout(() => ($('#setupCode').value ? $('#setupName') : $('#setupName')).focus(), 50);
  };
  const busy = on => { $('#joinBtn').disabled = on; $('#createBtn').disabled = on; };
  const nameOf = () => $('#setupName').value.trim();
  const go = async hid => { history.replaceState(null, '', location.pathname); login.hidden = true; await startHousehold(F, hid); };
  $('#setupCode').addEventListener('input', e => { e.target.value = e.target.value.replace(/\D/g, '').slice(0, 6); });
  $('#setupCode').addEventListener('keydown', e => { if (e.key === 'Enter') $('#joinBtn').click(); });
  $('#setupName').addEventListener('keydown', e => { if (e.key === 'Enter') $('#setupCode').focus(); });

    const code = $('#setupCode').value;
    if (!nameOf()) { $('#setupName').focus(); toast('Wie heißt du?'); return; }
    if (code.length !== 6) { $('#setupCode').focus(); toast('Der Code hat 6 Ziffern'); return; }
    busy(true);
    try { const hid = await joinHousehold(F, F.auth.currentUser.uid, code, nameOf()); if (hid) { await go(hid); toast('Willkommen im Haushalt!'); } else toast('Diesen Code gibt es nicht'); }
    catch(e) { console.warn(e); toast(navigator.onLine ? 'Beitreten hat nicht geklappt' : 'Zum Beitreten braucht es Internet'); }
    busy(false);
  };
  $('#createBtn').onclick = async () => {
    if (!nameOf()) { $('#setupName').focus(); toast('Wie heißt du?'); return; }
    busy(true);
    try { await go(await createHousehold(F, F.auth.currentUser.uid, nameOf())); toast('Haushalt angelegt. Den Code für die Familie findest du unter „Mehr“.'); }
    catch(e) { console.warn(e); toast(navigator.onLine ? 'Anlegen hat nicht geklappt' : 'Zum Anlegen braucht es Internet'); }
    busy(false);
  };
  let started = false;
  F.onAuthStateChanged(F.auth, async user => {
    if (!user) {
      try { await F.signInAnonymously(F.auth); } catch(e) { console.warn(e); hint.textContent = navigator.onLine ? 'Verbindung fehlgeschlagen. Bitte später erneut versuchen.' : 'Keine Internetverbindung. Beim ersten Start braucht es einmal Internet.'; login.hidden = false; }
      return;
    }
    if (started) return; started = true;
    R.uid = user.uid;
    try {
      const hid = await findHousehold(F, user.uid);

    } catch(e) { console.warn(e); started = false; showSetup(); }
  });
}

/* Aufräumen, einmal am Tag pro Gerät: Plan-Einträge, die älter als 14 Tage sind, wandern als kurzer
   Eintrag ins Monatsdokument des Verlaufs (log/JJJJ-MM, Feld „meals“). So wächst die Zahl der Dokumente,
   die bei jedem Start gelesen werden, nicht mit der Zeit. arrayUnion verhindert doppelte Einträge,
   falls zwei Geräte gleichzeitig aufräumen. */
function housekeeping(){
  const KEY = 'haushoed:housekept', t = today();
  try { if (localStorage.getItem(KEY) === t) return; } catch(e) {}
  const cut = addDays(t, -14), old = Object.values(S.plan).filter(e => e.date && e.date < cut);
  const byM = {};
  for (const e of old) (byM[e.date.slice(0, 7)] = byM[e.date.slice(0, 7)] || []).push({id: e.id, d: e.date, r: e.recipeId, n: (S.recipes[e.recipeId] || {}).name || '', s: e.servings || null, c: !!e.cooked});
  for (const [m, items] of Object.entries(byM)) {
    const doc = S.log[m] ? clone(S.log[m]) : {events: []}, have = new Set((doc.meals || []).map(x => x.id));
    doc.meals = [...(doc.meals || []), ...items.filter(x => !have.has(x.id))];
    S.log[m] = doc;
    if (R.active && window.HFB) remoteUpdate('log', m, {meals: window.HFB.arrayUnion(...items)});
  }
  for (const e of old) { delete S.plan[e.id]; remoteDel('plan', e.id); }
  if (old.length) { localSave(); render(); }
  try { localStorage.setItem(KEY, t); } catch(e) {}
}

/* Einmalige Anpassungen an bestehenden Daten */
function migrate(){
  const m = S.meta; const v = m.v || 1; if (v >= 4) return;
  if (v < 2) {
  m.locs = [...new Set((m.locs || []).map(l => l === 'Keller' ? 'Vorzimmer' : l))];
  if (!m.locs.includes('Vorzimmer')) m.locs.push('Vorzimmer');
  if (!m.cats.includes('Ätherische Öle')) { const i = m.cats.indexOf('Hygiene'); m.cats.splice(i >= 0 ? i + 1 : m.cats.length, 0, 'Ätherische Öle'); }
  for (const l of Object.values(m.learned || {})) if (l.loc === 'Keller') l.loc = 'Vorzimmer';
  m.v = 2;
  for (const x of Object.values(S.articles)) if (x.loc === 'Keller') { const c = clone(x); c.loc = 'Vorzimmer'; putArticle(c); }
  }
  // v3: doTERRA-Namen einheitlich schreiben
  for (const x of Object.values(S.articles)) { const nn = brandName(x.name); if (nn !== x.name) { const c = clone(x); c.name = nn; putArticle(c); S.articles[c.id] = c; } }
  for (const e of Object.values(S.shopping)) { if (!e.name) continue; const nn = brandName(e.name); if (nn !== e.name) putShop({...clone(e), name: nn}); }
  if (v < 3) for (const l of Object.values(m.learned || {})) l.label = brandName(l.label);
  // v4: passende Einheiten für Artikel, deren Einheit nie geändert wurde
  for (const x of Object.values(S.articles)) {
    if (x.unit && x.unit !== 'Stk' && x.unit !== 'Pkg') continue;
    const u = builtinGuess(x.name).unit || (x.mode === 'level' ? 'Pkg' : 'Stk');
    if (u !== x.unit) { const c = clone(x); c.unit = u; putArticle(c); }
  }
  m.v = 4;
  saveMeta();
}

/* ============ Fachlogik ============ */
/* Packungsgrößen: Größen werden in Gramm, Milliliter oder Stück gespeichert (a.base) */
const MEASURE = {kg: ['g', 1000], g: ['g', 1], gr: ['g', 1], gramm: ['g', 1], dag: ['g', 10], dkg: ['g', 10], mg: ['g', 0.001], l: ['ml', 1000], liter: ['ml', 1000], ml: ['ml', 1], cl: ['ml', 10], dl: ['ml', 100], stk: ['Stk', 1], 'stück': ['Stk', 1]};
function parseAmount(str){
  const m = String(str || '').trim().toLowerCase().match(/^(\d+(?:[.,]\d+)?)\s*([a-zäöü]+)?\.?$/);
  if (!m) return null;
  const v = parseFloat(m[1].replace(',', '.'));
  if (!(v > 0)) return null;
  if (!m[2]) return {v, base: null};
  const u = MEASURE[m[2]]; if (!u) return null;
  return {v: v * u[1], base: u[0]};
}
function fmtAmount(v, base){
  if (base === 'g') return v >= 1000 ? fmtNum(v / 1000) + ' kg' : fmtNum(v) + ' g';
  if (base === 'ml') return v >= 1000 ? fmtNum(v / 1000) + ' l' : fmtNum(v) + ' ml';
  return fmtNum(v) + ' Stk';
}
// Liest eine Größen-Eingabe für einen Artikel: null = keine Angabe, false = nicht verständlich
function readSize(art, str){
  const t = String(str || '').trim(); if (!t) return null;
  const p = parseAmount(t); if (!p) return false;
  if (!art.base || (p.base && p.base !== art.base && !(art.lots || []).some(l => l.size))) art.base = p.base || art.base || 'g';
  return p.v;
}
const total = a => (a.lots || []).reduce((s, l) => s + l.qty, 0);
const hasSizes = a => !!a.base && (a.lots || []).length > 0 && a.lots.every(l => l.size > 0);
const amount = a => (a.lots || []).reduce((s, l) => s + l.qty * (l.size || 0), 0);
const minValue = a => a.minAmt || a.min || 0;
/* Zählart „flag“ (nur melden, wenn's ausgeht): nichts wird abgehakt. Ein Artikel ist da (genau ein Lot mit qty 1,
   das die Daten von Einkauf und Haltbarkeit trägt), wird knapp (a.low, Lot bleibt) oder ist aus (keine Lots).
   Knapp und aus kommen von selbst auf die Einkaufsliste; Einräumen macht ihn wieder „da“. Rezepte prüfen nur,
   ob er da ist, und ziehen nichts ab. */
const isFlag = a => a.mode === 'flag';
const flagState = a => total(a) <= 0 ? 'out' : a.low ? 'low' : 'ok';
const hasMin = a => isFlag(a) || minValue(a) > 0;
const belowMin = a => isFlag(a) ? flagState(a) !== 'ok' : hasMin(a) && (a.minAmt ? amount(a) : total(a)) < minValue(a) - 1e-9;
const needsBuy = a => belowMin(a) && !a.snoozed;
const fmtMin = a => a.minAmt ? fmtAmount(a.minAmt, a.base) : fmtNum(a.min);
function suggestQty(a){
  if (isFlag(a)) return a.buy || 1;
  if (a.minAmt) { const need = a.packSize ? Math.ceil((a.minAmt - amount(a)) / a.packSize) : 1; return Math.max(a.buy || 1, need); }
  return Math.max(a.buy || 1, Math.ceil((a.min || 0) - total(a)));
}
function sizeGroups(a){
  const m = new Map();
  for (const l of a.lots || []) { const k = l.size || 0; m.set(k, (m.get(k) || 0) + (a.mode === 'level' ? 1 : l.qty)); }
  return m;
}
const unitOf = a => a.unit || (a.mode === 'level' ? 'Pkg' : 'Stk');
function lotStatus(l){
  if (l.expires && daysUntil(l.expires) < 0) return 'x';
  if (l.check && daysUntil(l.check) <= 0) return 'w';
  return '';
}
function articleStatus(a){
  let st = ''; for (const l of a.lots || []) { const s = lotStatus(l); if (s === 'x') return 'x'; if (s === 'w') st = 'w'; }
  return st;
}
const lotSortKey = l => l.expires || l.check || l.bought || '9999';
function sortedLots(a){ return [...(a.lots||[])].sort((x, y) => lotSortKey(x).localeCompare(lotSortKey(y))); }
function stockText(a){
  const t = total(a);
  if (isFlag(a)) return {ok: 'da', low: 'wird knapp', out: 'aus'}[flagState(a)];
  if (t <= 0) return 'leer';
  let txt;
  if (a.mode === 'level') {
    const c = {}; for (const l of a.lots) { const n = LEVEL_NAME(l.qty); c[n] = (c[n]||0) + 1; }
    const kinds = ['voll','halb','fast leer'].filter(n => c[n]);
    txt = kinds.length === 1 ? qtyUnit(c[kinds[0]], unitOf(a)) + ' ' + kinds[0] : qtyUnit(a.lots.length, unitOf(a)) + ': ' + kinds.map(n => c[n] + ' ' + n).join(', ');
  } else {
    txt = qtyUnit(t, unitOf(a));
    const o = (a.lots || []).filter(l => l.opened).reduce((s, l) => s + l.qty, 0);
    if (o > 0) txt += o === t ? (t === 1 ? ' offen' : ', alle offen') : ', ' + fmtNum(o) + ' offen';
  }
  const sizes = sizeGroups(a);
  if (a.mode !== 'level' && hasSizes(a) && sizes.size === 1) return txt + ' à ' + fmtAmount([...sizes.keys()][0], a.base);
  if (hasSizes(a)) return txt + ' (' + (a.mode === 'level' ? '≈ ' : '') + fmtAmount(amount(a), a.base) + ')';
  return txt;
}
function makeLots(a, qty, size){
  const b = today();
  const base = {bought: b, size: size || null, check: a.checkDays ? addDays(b, a.checkDays) : null, expires: a.maxDays ? addDays(b, a.maxDays) : null};
  if (a.mode === 'level') return Array.from({length: Math.max(1, Math.round(qty))}, () => ({id: newId(), qty: 1, ...base}));
  return [{id: newId(), qty, ...base}];
}
function addStock(a, qty, size){
  if (size === undefined) size = a.packSize || null;
  if (size) { a.packSize = size; a.sizesUsed = [...new Set([size, ...(a.sizesUsed || [])])].slice(0, 6); }
  if (isFlag(a)) { a.lots = makeLots(a, 1, size); a.low = false; a.snoozed = false; return a; }   // eingeräumt = da
  if (a.mode !== 'level') {
    const same = (a.lots||[]).find(l => l.bought === today() && !l.opened && (l.size || null) === (size || null));
    if (same) { same.qty += qty; a.snoozed = false; return a; }
  }
  a.lots = [...(a.lots||[]), ...makeLots(a, qty, size)];
  a.snoozed = false;
  return a;
}
// quiet: keine Meldung, stattdessen {msg, undo} zurückgeben (für den Scanner)
/* Öffnen: eine Einheit bekommt ein Öffnungsdatum. Prüf- und Ablaufdatum werden dann
   ab heute neu gerechnet, aber nie später als das ursprüngliche Datum. */
function applyOpen(a, l){
  const d = today(); l.opened = d;
  if (a.openCheckDays) { const c = addDays(d, a.openCheckDays); if (!l.check || c < l.check) l.check = c; }
  if (a.openMaxDays) { const e = addDays(d, a.openMaxDays); if (!l.expires || e < l.expires) l.expires = e; }
}
const isOpen = (a, l) => !!l.opened || (a.mode === 'level' && l.qty < 0.99);
const canOpen = a => !isFlag(a) && !!a.openable && (a.lots || []).some(l => !isOpen(a, l) && l.qty >= 0.99);
function openOne(id){
  const a0 = S.articles[id]; if (!a0) return;
  const a = clone(a0), before = clone(a0);
  const lot = sortedLots(a).find(l => !isOpen(a, l) && l.qty >= 0.99); if (!lot) return;

const KID_KEY = 'haushoed:kid';

async function invite(){
  const code = HH.data && HH.data.inviteCode; if (!code) return;

  try { if (navigator.share) { await navigator.share({title: 'Haushöd', text, url}); return; } } catch(e) { if (e && e.name === 'AbortError') return; }

}

async function exportData(){

async function importData(e){

function replaceAll(next){

/* Zurück-Taste: Solange ein Blatt offen ist, liegt ein eigener Eintrag im Browserverlauf.
   „Zurück“ entfernt ihn und schließt das Blatt, statt die App zu verlassen. */
const HIST = {open: false, skip: 0};
function openSheet(build){
  if (!HIST.open) { history.pushState({sheet: 1}, ''); HIST.open = true; }
  $('#sheetInner').innerHTML = '';
  $('#subInner').hidden = true;
  UI.sheet = build;
  build.refresh = () => { if (UI.sheet === build) build(); };
  build();
  $('#backdrop').classList.add('open'); $('#sheet').classList.add('open');
}
function hideSheet(){ $('#subInner').hidden = true; UI.sheet = null; $('#backdrop').classList.remove('open'); $('#sheet').classList.remove('open'); }
function closeSheet(){
  hideSheet();
  // Erst danach prüfen: Geht gleich ein anderes Blatt auf (z. B. Scanner → Neu anlegen → Scanner),
  // bleibt der Verlaufseintrag einfach stehen. So kommen sich „zurück“ und neuer Eintrag nicht in die Quere.
  setTimeout(() => { if (!UI.sheet && HIST.open) { HIST.open = false; HIST.skip++; history.back(); } }, 0);
}
addEventListener('popstate', () => {
  if (HIST.skip > 0) { HIST.skip--; return; }   // kam von closeSheet selbst
  if (HIST.open) { HIST.open = false; hideSheet(); }
});

const amtUnit = a => a.base === 'g' ? 'kg' : a.base === 'ml' ? 'l' : 'Stk';
const amtFactor = a => a.base === 'g' || a.base === 'ml' ? 1000 : 1;
const minInAmount = a => a._minIn ? a._minIn === 'amount' : a.minIn ? a.minIn === 'amount' : !!a.minAmt;
function readSettings(root, a){
  const v = id => root.querySelector(id);
  a.cat = v('#f-cat').value;
  if (v('#f-unit')) a.unit = v('#f-unit').value.trim() || (a.mode === 'level' ? 'Pkg' : 'Stk');
  if (v('#f-min')) {
    const mv = Math.max(0, num(v('#f-min').value));

    else { a.min = mv; a.minAmt = null; }
  }
  a.buy = Math.max(1, num(v('#f-buy').value, 1));

}
function bindSettings(root, a, onChange){
  root.querySelectorAll('[data-loc]').forEach(b => b.onclick = () => { a.loc = a.loc === b.dataset.loc ? '' : b.dataset.loc; onChange(true); });
  root.querySelectorAll('[data-mode]').forEach(b => b.onclick = () => { readSettings(root, a); a.mode = b.dataset.mode; a._openDetails = true; onChange(true); });
  root.querySelectorAll('[data-minin]').forEach(b => b.onclick = () => { a._minIn = b.dataset.minin; readSettings(root, a); a._openDetails = true; onChange(true); });
  root.querySelectorAll('#f-cat,#f-unit,#f-min,#f-buy,#f-check,#f-max,#f-ocheck,#f-omax').forEach(el => el.addEventListener('change', () => { readSettings(root, a); onChange(false); }));
  const op = root.querySelector('#f-openable'); if (op) op.addEventListener('change', () => { readSettings(root, a); a._openDetails = true; onChange(true); });
  root.querySelector('#f-details').addEventListener('toggle', e => { a._openDetails = e.target.open; });
  // Einheit: Vorschläge wie bei den Namen
  const ui = root.querySelector('#f-unit'), us = root.querySelector('#unitSugg');
  const showUnits = all => {
    const n = norm(ui.value);
    let list = UNITS.filter(u => all || !n || norm(u).includes(n));
    if (!all && n) list.sort((x, y) => norm(y).startsWith(n) - norm(x).startsWith(n));
    us.innerHTML = list.filter(u => u !== ui.value).map(u => '<button type="button" class="chip" data-unit="' + esc(u) + '">' + esc(u) + '</button>').join('');
  };
  ui.addEventListener('focus', () => { ui.select(); showUnits(true); });
  ui.addEventListener('input', () => showUnits(false));
  ui.addEventListener('blur', () => setTimeout(() => { us.innerHTML = ''; }, 150));
  us.addEventListener('mousedown', e => e.preventDefault());
  us.addEventListener('click', e => {
    const b = e.target.closest('[data-unit]'); if (!b) return;
    ui.value = b.dataset.unit; us.innerHTML = ''; ui.blur();
    readSettings(root, a); onChange(false);
  });
}

const titleCase = s => s.replace(/(^|[\s\-&\/])([a-zäöüßāōéè])/g, (m, p, c) => p + c.toUpperCase());
const BRAND_CASE = {'aromatouch':'AromaTouch','digestzen':'DigestZen','zengest':'ZenGest','clarycalm':'ClaryCalm','intune':'InTune','pasttense':'PastTense','metapwr':'MetaPWR','terrashield':'TerraShield','hd clear':'HD Clear','ddr prime':'DDR Prime','salubelle':'Salubelle','zendocrine':'Zendocrine','ylang ylang':'Ylang Ylang'};

let DICT_NAMES = null;
function dictNames(){
  if (!DICT_NAMES) { const m = new Map(); for (const e of DICT_TERMS) if (e.t.length >= 3 && !SUGGEST_SKIP.has(e.t) && !m.has(e.t)) m.set(e.t, dictLabel(e)); DICT_NAMES = [...m.values()]; }

function suggestions(q, max){
  const n = norm(q); if (n.length < 2) return [];
  const out = new Map();
  const consider = (label, base, extra, known) => {
    const l = norm(label); if (!l || l === n) return;
    let s = 0;
    if (l.startsWith(n)) s = 3;
    else if (l.split(/[\s\-]+/).some(w => w.startsWith(n))) s = 2;
    else if (n.length >= 3 && l.includes(n)) s = 1;
    if (!s) return;
    const score = base + s * 10 - Math.min(l.length, 40) / 100;
    const prev = out.get(l); if (!prev || prev.score < score) out.set(l, {label, score, extra, known});
  };
  for (const a of Object.values(S.articles)) consider(a.name, 300, stockText(a), true);
  for (const v of Object.values(S.meta.learned || {})) consider(v.label, 200);
  for (const d of dictNames()) consider(d, 100);
  return [...out.values()].sort((x, y) => y.score - x.score).slice(0, max);
}

const SOFT_UNITS = {el: 'EL', tl: 'TL', 'esslöffel': 'EL', 'teelöffel': 'TL', prise: 'Prise', prisen: 'Prisen', msp: 'Msp', messerspitze: 'Msp', schuss: 'Schuss', spritzer: 'Spritzer', handvoll: 'Handvoll', zehe: 'Zehe', zehen: 'Zehen', scheibe: 'Scheibe', scheiben: 'Scheiben', blatt: 'Blatt', 'blätter': 'Blätter', zweig: 'Zweig', zweige: 'Zweige', tropfen: 'Tropfen', stange: 'Stange', stangen: 'Stangen'};
const COUNT_UNITS = (() => {
  const m = {'stück': 'Stk', stueck: 'Stk', stk: 'Stk', pkg: 'Packung', pck: 'Packung', pkt: 'Packung'};
  for (const u of UNITS) { m[u.toLowerCase()] = u; if (PLURAL[u]) m[PLURAL[u].toLowerCase()] = u; }
  delete m.stange; return m;
})();
// Löffel: in Milliliter, damit sie gegen Flaschen (ml) und über „1 EL wiegt“ gegen Pulver (g) rechnen
const SPOON_ML = {EL: 15, TL: 5};
const FRACS = {'½': 0.5, '¼': 0.25, '¾': 0.75, '⅓': 1/3, '⅔': 2/3};
function parseQty(t){
  if (FRACS[t]) return FRACS[t];
  let m = t.match(/^(\d+)\s+(\d+)\/(\d+)$/); if (m) return +m[1] + m[2] / m[3];
  m = t.match(/^(\d+)\/(\d+)$/); if (m) return m[1] / m[2];
  return parseFloat(t.replace(',', '.'));
}
/* Eine Zutatenzeile verstehen: „200 g Mehl“, „2 Eier“, „1 Dose Kokosmilch“, „1 EL Öl“, „Salz“.
   EL und TL bleiben „weich“ (fehlen sie im Vorrat, kommen sie nicht auf die Liste), haben aber eine Menge in ml. */
function parseIngredient(raw){
  const line = String(raw || '').trim().replace(/^[-•*–]\s*/, ''); if (!line) return null;
  const m = line.match(/^((?:\d+\s+)?\d+\/\d+|\d+(?:[.,]\d+)?|[½¼¾⅓⅔])\s*(.*)$/);
  let qty = null, rest = line, kind = null, unit = null, base = null, amt = null, spoon = false;
  if (m) { qty = parseQty(m[1]); rest = m[2].trim(); }
  const w = rest.match(/^([A-Za-zÄÖÜäöüß]+)\.?\s+(.+)$/);
  if (qty != null && w) {
    const u = w[1].toLowerCase();
    if (MEASURE[u]) { kind = 'measure'; base = MEASURE[u][0]; amt = qty * MEASURE[u][1]; unit = w[1]; rest = w[2]; }
    else if (COUNT_UNITS[u]) { kind = 'count'; unit = COUNT_UNITS[u]; rest = w[2]; }
    else if (SOFT_UNITS[u]) { kind = 'soft'; unit = SOFT_UNITS[u]; rest = w[2]; if (SPOON_ML[unit]) { spoon = true; base = 'ml'; amt = qty * SPOON_ML[unit]; } }
  }
  if (!kind) kind = qty != null ? 'count' : 'soft';
  const name = rest.replace(/\(.*?\)/g, '').split(',')[0].replace(/\b(etwas|nach geschmack|optional|zum servieren)\b/gi, '').replace(/\s+/g, ' ').trim();
  return name ? {raw: line, qty, kind, unit, base, amt, spoon, name} : null;
}
const recipeIngredients = r => String(r.ingredients || '').split('\n').map(parseIngredient).filter(Boolean);
const stem = s => norm(s).replace(/(en|er|e|n|s)$/, '');
/* Zutat einem Vorratsartikel zuordnen: gleicher Name, Ein-/Mehrzahl, oder enthaltenes Wort */
/* Zuordnung Zutat → Vorrat. S.meta.links = {Zutat (norm): [Artikel-IDs] | 'none'}. Ist eine Zutat zugeordnet,
   zählen genau diese Artikel (in dieser Reihenfolge: zuerst wird vom ersten genommen, nachgekauft wird der erste);
   'none' heißt „nicht im Vorrat führen“ (fehlt nie). Sonst sucht matchArticle nach dem Namen. Gesucht wird die
   Zuordnung über den genauen Namen, sonst über den Wortstamm („Zwiebel“ findet „Zwiebeln“). */
function linkKey(name){
  const n = norm(name), L = S.meta.links || {};
  if (L[n]) return n;
  const sn = stem(n);
  return Object.keys(L).find(k => stem(k) === sn) || n;
}
const linkOf = name => (S.meta.links || {})[linkKey(name)] || null;
function ingArticles(name){
  const l = linkOf(name);
  if (l === 'none') return {arts: [], how: 'none'};
  // Eine leere Liste heißt „bewusst nichts zugeordnet“ (die Zutat fehlt dann), nicht „automatisch“
  if (Array.isArray(l)) return {arts: l.map(id => S.articles[id]).filter(Boolean), how: 'link'};
  const a = matchArticle(name);
  return {arts: a ? [a] : [], how: 'auto'};
}
function setLink(name, val){
  const before = clone(S.meta.links || {}), k = linkKey(name);
  S.meta.links = {...before};
  if (val == null) delete S.meta.links[k]; else S.meta.links[k] = Array.isArray(val) ? [...new Set(val)] : val;
  saveMeta();
  return () => { S.meta.links = before; saveMeta(); };
}
/* Eine Zutat aus einer Gruppe von Artikeln erfüllen: der Reihe nach, jeweils in der Maßeinheit des Artikels.
   take(a, need, want) nimmt bis zu want und sagt, wie viel es bekam; bei need.metric 'any' heißt 1 „ist da“.
   Ergebnis: short = Anteil der Zutat, der fehlt (0 bis 1). */
function fulfill(ing, arts, f, take){
  let p = 1; const parts = [];
  for (const a of arts) {
    if (p <= 1e-9) break;
    const need = ingNeed(ing, a, f);
    if (need.metric === 'any' || !(need.v > 0)) { const got = take(a, need, 0); parts.push({a, need, got}); if (got) p = 0; continue; }
    const want = need.v * p, got = Math.min(want, take(a, need, want));

const ingSoft = ing => ing.kind === 'soft';
function matchArticle(name){
  const n = norm(name); if (!n) return null;
  const arts = Object.values(S.articles);
  let a = arts.find(x => norm(x.name) === n); if (a) return a;
  const sn = stem(n);
  a = arts.find(x => stem(x.name) === sn); if (a) return a;
  let best = null;
  for (const x of arts) {
    const k = norm(x.name), ks = stem(x.name);
    if ((k.length >= 3 && n.includes(k)) || (ks.length >= 4 && n.includes(ks))) if (!best || k.length > norm(best.name).length) best = x;
  }
  if (best) return best;
  const words = n.split(' ').map(stem);
  return arts.find(x => norm(x.name).split(' ').some(w => w.length >= 4 && words.includes(stem(w)))) || null;
}
/* Was eine Zutat vom Artikel braucht: Menge (amt), Anzahl (cnt) oder nur „vorhanden“ (any).

function amtNeed(ing, a, f){
  if (!hasSizes(a)) return {metric: 'any', v: 0, why: a.base !== 'Stk' && total(a) > 0 ? 'size' : null};
  const v = ing.amt * f;
  if (a.base === ing.base) return {metric: 'amt', v};
  if (ing.base === 'ml' && a.base === 'g') { const g = elgOf(a); return g ? {metric: 'amt', v: v * g / 15} : {metric: 'any', v: 0, why: 'weight'}; }
  return {metric: 'any', v: 0};
}
function ingNeed(ing, a, f){
  if (isFlag(a)) return {metric: 'any', v: 0};
  if (ing.kind === 'soft') return ing.spoon ? amtNeed(ing, a, f) : {metric: 'any', v: 0};
  if (ing.kind === 'measure') return amtNeed(ing, a, f);
  const q = (ing.qty || 1) * f;
  if ((!ing.unit || ing.unit === 'Stk') && a.base === 'Stk' && hasSizes(a)) return {metric: 'amt', v: q};
  if ((!ing.unit && unitOf(a) === 'Stk') || ing.unit === unitOf(a)) return {metric: 'cnt', v: q};

}
const factorOf = (e, r) => (e && e.servings ? e.servings : (r.servings || 1)) / (r.servings || 1);
function scaledText(ing, f){
  if (ing.kind === 'measure') return fmtAmount(ing.amt * f, ing.base) + ' ' + ing.name;
  if (ing.qty != null) { const q = ing.qty * f; return fmtNum(q) + ' ' + (ing.unit ? (Math.abs(q - 1) < 1e-9 ? ing.unit : PLURAL[ing.unit] || ing.unit) + ' ' : '') + ing.name; }

}
/* Gesamtrechnung für den Plan. Geht Gericht für Gericht in Datumsreihenfolge durch und verbraucht dabei
   einen simulierten Vorrat Einheit für Einheit (offene und früh ablaufende zuerst). Für jedes Gericht gilt
   der Stand an seinem Tag: Was bis dahin abgelaufen ist, zählt nicht; was bis dahin geprüft werden muss,
   wird als „prüfen“ gemeldet. Ergebnis:
   - status[planId] = {missing: [Namen], check: [Namen]} für die Übersicht
   - detail[planId] = pro Zutat, was davon da ist, was zu prüfen und was zu kaufen ist
   - buy = was innerhalb des Planungszeitraums nachgekauft werden muss (für die Einkaufsliste) */
function simLots(a){
  return sortedLots(a).map(l => ({qty: l.qty, size: l.size || 0, check: l.check || null, expires: l.expires || null, open: isOpen(a, l)}))
    .sort((x, y) => (y.open ? 1 : 0) - (x.open ? 1 : 0));
}
function simTake(lots, metric, v, date){
  const r = {ok: 0, chk: 0, short: 0, expired: 0, chkFrom: null};
  const usable = l => !l.expires || l.expires >= date;
  const val = l => metric === 'amt' ? l.qty * l.size : l.qty;
  for (const l of lots) if (!usable(l)) r.expired += val(l);
  const noteChk = l => { if (!r.chkFrom || l.check < r.chkFrom) r.chkFrom = l.check; };
  if (metric === 'any') {
    const u = lots.filter(l => usable(l) && l.qty > 1e-9);
    if (!u.length) r.short = 1;
    else if (u.every(l => l.check && l.check <= date)) { r.chk = 1; u.forEach(noteChk); }
    else r.ok = 1;
    return r;
  }
  let rest = v;
  for (const l of lots) {
    if (rest <= 1e-9) break;
    if (!usable(l)) continue;
    const have = val(l); if (have <= 1e-9) continue;
    const t = Math.min(have, rest);
    l.qty -= metric === 'amt' ? t / l.size : t; rest -= t;
    if (l.check && l.check <= date) { r.chk += t; noteChk(l); } else r.ok += t;
  }
  r.short = rest > 1e-9 ? rest : 0;
  return r;
}
function planCalc(){
  const t0 = today(), hEnd = addDays(t0, (S.meta.planDays || 7) - 1);
  const entries = Object.values(S.plan).filter(e => !e.cooked && e.date >= t0 && S.recipes[e.recipeId])
    .sort((x, y) => x.date.localeCompare(y.date) || (x.created || 0) - (y.created || 0));
  const sim = {}, status = {}, detail = {}, buy = {};
  const lotsOf = a => sim[a.id] || (sim[a.id] = simLots(a));
  const want = (key, art, name, recipe, field, v, ing) => {
    const b = buy[key] || (buy[key] = {art, name, amt: 0, cnt: 0, any: false, recipes: new Set(), mAmt: {}});
    b.recipes.add(recipe);
    if (!art && ing && ing.kind === 'measure') { b.mAmt[ing.base] = (b.mAmt[ing.base] || 0) + v; return; }
    if (field === 'any') b.any = true; else b[field] += v;
  };
  for (const e of entries) {
    const r = S.recipes[e.recipeId], f = factorOf(e, r), inH = e.date <= hEnd, missing = [], check = [], lines = [];
    for (const ing of recipeIngredients(r)) {
      const {arts, how} = ingArticles(ing.name);
      if (!arts.length) {
        if (how !== 'none' && !ingSoft(ing)) { missing.push(ing.name); if (inH) want('n:' + norm(ing.name), null, ing.name, r.name, 'cnt', ing.kind === 'measure' ? ing.amt * f : (ing.qty || 1) * f, ing); }
        lines.push({ing, a: null, how});

      }
      const a = arts[0];
      if (arts.length === 1) {
        const need = ingNeed(ing, a, f), res = simTake(lotsOf(a), need.metric, need.v, e.date);
        if (res.short > 0) { missing.push(a.name); if (inH) want('a:' + a.id, a, a.name, r.name, need.metric, res.short); }
        if (res.chk > 0) check.push(a.name);

        if (res.chk > 0) chk = true;
        if (need.metric === 'any') return res.short ? 0 : 1;
        return w - res.short;
      });

      if (chk) check.push(ing.name);
      if (res.short > 0) { missing.push(ing.name); if (inH) want('a:' + a.id, a, a.name, r.name, need.metric, res.short); }
      lines.push({ing, a, arts, how, need, res});
    }

function buyQty(b){
  const a = b.art; if (!a) return Math.max(1, Math.ceil(b.cnt));
  let q = 0;
  if (b.amt > 0) q = Math.max(q, a.packSize ? Math.ceil(b.amt / a.packSize - 1e-9) : 1);
  if (b.cnt > 0) q = Math.max(q, Math.ceil(b.cnt - 1e-9));
  if (b.any) q = Math.max(q, a.buy || 1);

/* Ein einzelnes Rezept gegen den aktuellen Vorrat prüfen (ohne Reservierung) */
function recipeMissing(r, servings){
  const f = (servings || r.servings || 1) / (r.servings || 1), rem = {}, miss = [];
  for (const ing of recipeIngredients(r)) {
    const {arts, how} = ingArticles(ing.name);
    if (!arts.length) { if (how !== 'none' && !ingSoft(ing)) miss.push(ing.name); continue; }
    const fu = fulfill(ing, arts, f, (a, need, w) => takeStock(rem, a, need, w));
    if (fu.short > 1e-9) miss.push(arts.length === 1 ? arts[0].name : ing.name);

function takeStock(rem, a, need, w){
  const st = rem[a.id] || (rem[a.id] = {amt: amount(a), cnt: total(a)});
  if (need.metric === 'any') return st.cnt > 1e-9 ? 1 : 0;
  const g = Math.min(st[need.metric], w); st[need.metric] -= g; return g;

const missText = miss => miss.length ? 'fehlt: ' + miss.slice(0, 3).join(', ') + (miss.length > 3 ? ' +' + (miss.length - 3) : '') : 'alles da';

/* Kochen: Zutaten aus dem Vorrat austragen */
function deductAmount(a, v){
  let rest = v;
  const t0 = amount(a);
  const lots = sortedLots(a).filter(l => l.size > 0).sort((x, y) => (x.qty < 0.99 ? 0 : 1) - (y.qty < 0.99 ? 0 : 1));
  for (const l of lots) {
    if (rest <= 1e-9) break;
    const live = a.lots.find(z => z.id === l.id), take = Math.min(live.qty * live.size, rest);
    live.qty -= take / live.size; rest -= take;
  }
  a.lots = a.lots.filter(l => l.qty > 0.02);
  return Math.min(v, t0);
}
function deductCount(a, n){
  let rest = n;
  const t0 = total(a);
  for (const l of sortedLots(a)) {
    if (rest <= 1e-9) break;
    const live = a.lots.find(z => z.id === l.id), take = Math.min(live.qty, rest);
    live.qty -= take; rest -= take;
  }
  a.lots = a.lots.filter(l => l.qty > 0.02);
  return Math.min(n, t0);
}

  const lots = sortedLots(a); const opened = lots.find(l => l.qty < 0.99) || lots[0]; if (!opened) return;
  const live = a.lots.find(z => z.id === opened.id), nxt = LEVELS.find(v => v < live.qty - 0.01);
  if (nxt) live.qty = nxt; else a.lots = a.lots.filter(l => l.id !== live.id);
}
function cook(planId){
  const e = S.plan[planId], r = e && S.recipes[e.recipeId]; if (!r) return;
  const f = factorOf(e, r), work = {}, before = {};
  for (const ing of recipeIngredients(r)) {
    if (ing.kind === 'soft' && !ing.spoon) continue;
    const arts = ingArticles(ing.name).arts.filter(a0 => total(work[a0.id] || a0) > 0);
    if (!arts.length) continue;
    // Der Reihe nach austragen; ein Artikel ohne messbare Menge deckt den Rest (Füllstand: eine Stufe weniger)
    fulfill(ing, arts, f, (a0, need, w) => {
      if (!before[a0.id]) before[a0.id] = clone(S.articles[a0.id]);
      const a = work[a0.id] || (work[a0.id] = clone(S.articles[a0.id]));
      if (need.metric === 'amt') return deductAmount(a, w);
      if (need.metric === 'cnt') return deductCount(a, w);
      if (a.mode === 'level' && ing.kind === 'measure') stepLevel(a);
      return 1;
    });
  }
  Object.values(work).forEach(putArticle);
  const eb = clone(e); putPlan({...clone(e), cooked: true});
  toast(r.name + ' gekocht, Zutaten ausgetragen', () => { Object.values(before).forEach(putArticle); putPlan(eb); });
}

/* Bewertung, Zeiten, Tags.

function ingStat(ing, inner, fix){

const WHY_TEXT = {size: 'Menge ungeprüft, Packungsgröße fehlt', weight: 'Menge ungeprüft, Gewicht pro EL fehlt'};
function mealPreview(planId){
  const {detail} = planCalc(), d = detail[planId]; if (!d) return null;
  if (!d.lines.length) return '';
  const e = S.plan[planId], f = factorOf(e, S.recipes[e.recipeId]);
  // Schon aus anderem Grund auf der Liste (selbst eingetragen oder Mindestbestand)?
  const onList = new Set(shopList().filter(x => !x.plan).map(x => x.articleId).filter(Boolean));
  const fmtV = (a, metric, v) => metric === 'amt' ? fmtAmount(v, a.base) : qtyUnit(Math.round(v * 100) / 100, unitOf(a));
  let nChk = 0, nBuy = 0;
  const rows = d.lines.map(({ing, a, arts, how, need, res}) => {
    const line = (parts, who, fix) => '<div class="ingline"><span>' + esc(scaledText(ing, f)) + '</span>' + ingStat(ing, (who ? esc(who) : '') + parts.map(([t, c]) => '<span class="' + c + '">' + esc(t) + '</span>').join(', '), fix) + '</div>';
    if (!a) {
      if (how === 'none') return line([['nicht im Vorrat geführt', '']]);
      if (ing.kind === 'soft') return line([['nicht im Vorrat erfasst', '']]);
      nBuy++;
      return line([['kaufen, nicht im Vorrat', 'miss']]);
    }
    const parts = [], since = res.chkFrom ? ' (ab ' + fmtDate(res.chkFrom) + ')' : '';
    if (need.metric === 'any') {
      if (res.short) parts.push(['kaufen', 'miss']);
      else if (res.chk) parts.push(['prüfen' + since, 'chk']);
      else parts.push(['da', 'ok']);
    } else {
      if (res.ok > 1e-9 && (res.chk > 1e-9 || res.short > 1e-9)) parts.push([fmtV(a, need.metric, res.ok) + ' da', 'ok']);
      if (res.chk > 1e-9) parts.push([fmtV(a, need.metric, res.chk) + ' prüfen' + since, 'chk']);
      if (res.short > 1e-9) {
        let t = fmtV(a, need.metric, res.short) + ' kaufen';
        if (need.metric === 'amt' && a.packSize) t += ' (' + qtyUnit(Math.ceil(res.short / a.packSize - 1e-9), unitOf(a)) + ')';
        parts.push([t, 'miss']);
      }
      if (!parts.length) parts.push(['da', 'ok']);
    }
    if (res.short && res.expired > 1e-9) parts.push(['bis dahin abgelaufen: ' + fmtV(a, need.metric === 'any' ? 'cnt' : need.metric, res.expired), '']);
    if (res.short && onList.has(a.id)) parts.push(['steht auf der Liste', '']);
    if (res.chk > 1e-9) nChk++; if (res.short > 1e-9) nBuy++;
    const fix = need.why ? '<button type="button" class="linkbtn" data-fixart="' + esc(a.id) + '">' + esc(WHY_TEXT[need.why]) + '</button>' : '';
    const names = (arts || [a]).map(x => x.name);
    return line(parts, names.length === 1 && norm(a.name) === norm(ing.name) ? '' : names.join(', ') + ': ', fix);
  }).join('');
  const sum = nBuy + nChk === 0 ? 'Für ' + dayLabel(e.date) + ' ist alles da.'
    : 'Für ' + dayLabel(e.date) + ': ' + [nChk ? nChk + ' prüfen' : '', nBuy ? nBuy + ' nachkaufen' : ''].filter(Boolean).join(', ') + '.' +
      (nBuy ? (d.inH ? ' Fehlendes steht automatisch auf der Einkaufsliste.' : ' Kommt auf die Einkaufsliste, sobald der Tag in den nächsten ' + (S.meta.planDays || 7) + ' Tagen liegt.') : '');
  return '<p class="hint" style="margin:0 0 4px">' + esc(sum) + '</p><div class="ingprev">' + rows + '</div>';
}
function ingPreview(r, f){

    const {arts, how} = ingArticles(ing.name);

    else if (!arts.length) { note = ingSoft(ing) ? 'nicht im Vorrat erfasst' : 'nicht im Vorrat'; cls = ingSoft(ing) ? '' : 'miss'; }
