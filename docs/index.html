/* ============ Barcodes ============
   Ein Artikel kann mehrere Barcodes haben (a.codes = [{c, q, size, n}]): die Hafermilch von zwei Marken,
   die 500-g- und die 1-kg-Packung. q ist, wie viele Einheiten ein Scan zählt (Kiwi im 3er-Pack: 3),
   size die Größe einer Einheit in der Grundeinheit des Artikels, n der Name laut Datenbank. */
const SCAN_FORMATS = ['ean_13', 'ean_8', 'upc_a', 'upc_e'];
const VENDOR = {js: 'vendor/barcode-detector-3.2.2.js', wasm: 'vendor/zxing_reader-3.1.3.wasm'};
// Prüfziffer von EAN-8, EAN-13 und GTIN-14, damit Fehllesungen nicht als Artikel hängen bleiben
function validCode(c){
  if (!/^(\d{8}|\d{13}|\d{14})$/.test(c)) return false;
  const d = c.split('').map(Number), last = d.pop();
  const s = d.reverse().reduce((t, n, i) => t + n * (i % 2 ? 1 : 3), 0);
  return (10 - s % 10) % 10 === last;
}
// UPC-A (12 Ziffern) wird wie im Handel als EAN-13 mit führender 0 gespeichert
function normCode(raw, format){
  let c = String(raw || '').replace(/\D/g, '');
  if (c.length === 12) c = '0' + c;
  if (format === 'upc_e') return /^\d{8}$/.test(c) ? c : '';
  return validCode(c) ? c : '';
}
const findByCode = c => Object.values(S.articles).find(a => (a.codes || []).some(x => x.c === c)) || null;
function attachCode(a, c, size, label, count){
  // Ein Barcode gehört immer genau einem Artikel
  for (const o of Object.values(S.articles)) if (o.id !== a.id && (o.codes || []).some(x => x.c === c)) { const oc = clone(o); oc.codes = oc.codes.filter(x => x.c !== c); putArticle(oc); }
  let sz = null;
  if (size && size.v > 0 && size.base && (!a.base || a.base === size.base)) { a.base = size.base; sz = size.v; }
  const prev = (a.codes || []).find(x => x.c === c);
  a.codes = [...(a.codes || []).filter(x => x.c !== c), {c, q: count > 1 ? Math.round(count) : (prev && prev.q) || 1, size: sz, n: label || null}];
  return a;
}
function codesField(a){
  const list = a.codes || [];
  const rows = list.map(x => '<div class="lot"><div class="l">' + esc(x.c) + '<small>' + esc([x.n, x.size && a.base ? 'à ' + fmtAmount(x.size, a.base) : ''].filter(Boolean).join(', ') || 'ohne weitere Angaben') + '</small></div>' +
    '<div class="stepper" title="So viel zählt ein Scan"><button type="button" data-cq="' + esc(x.c) + '" data-d="-1" aria-label="weniger pro Scan">−</button><span>' + esc(qtyUnit(x.q || 1, unitOf(a))) + '</span><button type="button" data-cq="' + esc(x.c) + '" data-d="1" aria-label="mehr pro Scan">+</button></div>' +
    '<button class="xbtn" data-delcode="' + esc(x.c) + '" aria-label="Barcode ' + esc(x.c) + ' entfernen">×</button></div>').join('');
  return '<div class="field"><span class="lbl">Barcodes</span>' + (rows ? '<p class="hint" style="margin:0 0 4px">Die Menge rechts zählt ein Scan beim Einräumen, etwa 3 für einen 3er-Pack.</p>' + rows : '') + (rows ? '' : '<p class="hint" style="margin:0 0 8px">Noch keiner. Mit Barcode erkennt der Scanner diesen Artikel sofort.</p>') +
    '<button type="button" class="btn ghost" id="scanCode" style="margin-top:6px">Barcode scannen</button></div>';
}

/* Open Food Facts (Lebensmittel), dazu die Schwester-Datenbanken für Kosmetik und sonstige Produkte.
   Es geht nur der Barcode hinaus, sonst nichts. */
async function lookupCode(c){
  const fields = 'product_name,product_name_de,brands,quantity,product_quantity,product_quantity_unit';
  const one = async host => {
    const ctl = new AbortController(), t = setTimeout(() => ctl.abort(), 7000);
    try {
      const r = await fetch('https://world.' + host + '/api/v2/product/' + c + '?fields=' + fields, {signal: ctl.signal});
      if (!r.ok) return null;
      const d = await r.json();
      return d && d.status === 1 && d.product ? d.product : null;
    } catch(e) { return null; } finally { clearTimeout(t); }
  };
  let p = await one('openfoodfacts.org');
  if (!p) { const [b, o] = await Promise.all([one('openbeautyfacts.org'), one('openproductsfacts.org')]); p = b || o; }
  if (!p) return null;
  const name = String(p.product_name_de || p.product_name || '').trim();
  const brand = String(p.brands || '').split(',')[0].trim();
  if (!name && !brand) return null;
  let size = null, count = null;
  const qs = String(p.quantity || '').replace(/\s*℮\s*$/, '').trim();
  const multi = qs.match(/^(\d+)\s*[x×]\s*(.+)$/i);   // „6 x 0,5 l“: 6 Einheiten à 0,5 l
  if (multi) { count = +multi[1]; const q = parseAmount(multi[2]); if (q && q.base) size = q; }
  else {
    const pq = num(p.product_quantity), pu = String(p.product_quantity_unit || '').toLowerCase();
    if (pq > 0 && MEASURE[pu]) size = {v: pq * MEASURE[pu][1], base: MEASURE[pu][0]};
    else { const q = parseAmount(qs); if (q && q.base) size = q; }
  }
  if (size && size.base === 'Stk') { count = Math.round(size.v); size = null; }   // „3 Stk“ ist eine Stückzahl, keine Größe
  if (!(count > 1)) count = null;
  return {name: name || brand, brand: name && brand && !norm(name).includes(norm(brand)) ? brand : '', size, count};
}
const infoLabel = info => info ? [info.brand, info.name].filter(Boolean).join(' ') : null;
// Welche vorhandenen Artikel könnten gemeint sein? („Ja! Natürlich Bio-Vollmilch“ → Milch)
function articleMatches(name, max){
  const n = norm(name), words = n.split(/[^a-zäöüß0-9]+/), nt = tokens(n), g = builtinGuess(name);
  const out = [];
  for (const a of Object.values(S.articles)) {
    const k = norm(a.name); if (!k) continue;
    let s = 0;
    if (words.includes(k) || (k.length >= 4 && n.includes(k))) s = 100 + k.length;
    else { const kt = tokens(k); const common = nt.filter(t => kt.some(x => x === t || (x.length >= 4 && t.endsWith(x)))); if (common.length) s = 10 + common.join('').length; }
    if (s && g.cat && a.cat === g.cat) s += 5;
    if (s) out.push([s, a]);
  }
  return out.sort((x, y) => y[0] - x[0]).slice(0, max).map(x => x[1]);
}

/* Erkennung: eingebauter BarcodeDetector (Chrome auf Android), sonst ZXing als WebAssembly (iPhone, Firefox).
   Die Bibliothek liegt in docs/vendor und wird erst beim ersten Scannen geladen. */
const SCAN = {stream: null, detector: null, loading: null};
function loadScript(src){
  return new Promise((res, rej) => { const s = document.createElement('script'); s.src = src; s.onload = res; s.onerror = () => rej(new Error('Laden fehlgeschlagen: ' + src)); document.head.appendChild(s); });
}
async function getDetector(){
  if (SCAN.detector) return SCAN.detector;
  if (!SCAN.loading) SCAN.loading = (async () => {
    if ('BarcodeDetector' in window) {
      try { const f = await window.BarcodeDetector.getSupportedFormats(); const use = SCAN_FORMATS.filter(x => f.includes(x)); if (use.includes('ean_13')) return new window.BarcodeDetector({formats: use}); } catch(e) {}
    }
    if (!window.BarcodeDetectionAPI) await loadScript(VENDOR.js);
    const wasm = new URL(VENDOR.wasm, location.href).href;
    await window.BarcodeDetectionAPI.prepareZXingModule({overrides: {locateFile: (p, pre) => p.endsWith('.wasm') ? wasm : pre + p}, fireImmediately: true});
    return new window.BarcodeDetectionAPI.BarcodeDetector({formats: SCAN_FORMATS});
  })();
  try { SCAN.detector = await SCAN.loading; } catch(e) { SCAN.loading = null; throw e; }
  return SCAN.detector;
}

const SCAN_MODES = [['add', 'Einräumen'], ['use', 'Verbraucht'], ['look', 'Nachschauen']];
const SCAN_HINT = {add: 'Jeder Scan zählt dazu.', use: 'Jeder Scan zieht 1 ab.', look: 'Ein Scan öffnet den Artikel.', assign: 'Scanne den Barcode auf der Packung.'};
function openScanner(opts = {}){
  const root = $('#sheetInner');
  const st = {mode: opts.assignTo ? 'assign' : (UI.scanMode || 'add'), paused: false, panel: null, last: '', lastSeen: 0, torch: false};
  let video, canvas, ctx, timer = null, starting = false;
  const alive = () => UI.sheet === shell && root.contains(video);
  const setMsg = t => { const m = root.querySelector('#camMsg'); if (m) m.textContent = t; };
  const stop = () => {
    clearTimeout(timer); timer = null;
    if (SCAN.stream) { SCAN.stream.getTracks().forEach(t => t.stop()); SCAN.stream = null; }
    if (video) video.srcObject = null;
  };
  const leave = next => { stop(); next(); };
  const close = () => leave(closeSheet);
  const resume = () => { st.paused = false; st.panel = null; st.lastSeen = Date.now(); panel(); };

  const start = async () => {
    if (starting || SCAN.stream) return; starting = true;
    if (!navigator.mediaDevices || !navigator.mediaDevices.getUserMedia) { setMsg('Hier ist kein Kamerazugriff möglich. Tipp den Code unten ein.'); starting = false; return; }
    setMsg('Kamera startet …');
    let stream = null;
    try {
      stream = await navigator.mediaDevices.getUserMedia({video: {facingMode: {ideal: 'environment'}, width: {ideal: 1280}, height: {ideal: 720}}, audio: false});
      if (!alive()) { stream.getTracks().forEach(t => t.stop()); return; }
      SCAN.stream = stream; video.srcObject = stream;
      await video.play().catch(() => {});
      setMsg('Scanner lädt …');
      await getDetector();
      if (!alive()) { stop(); return; }
      const track = stream.getVideoTracks()[0], caps = track && track.getCapabilities ? track.getCapabilities() : {};
      const tb = root.querySelector('#torch');
      if (caps.torch && tb) { tb.hidden = false; tb.onclick = async () => { st.torch = !st.torch; tb.setAttribute('aria-pressed', st.torch); try { await track.applyConstraints({advanced: [{torch: st.torch}]}); } catch(e) {} }; }
      setMsg('');
      tick();
    } catch(e) {
      console.warn(e); stop();
      const n = e && e.name;
      setMsg(n === 'NotAllowedError' || n === 'SecurityError' ? 'Kein Zugriff auf die Kamera. Erlaub ihn in den Browser-Einstellungen oder tipp den Code unten ein.'
        : n === 'NotFoundError' || n === 'OverconstrainedError' ? 'Keine Kamera gefunden. Tipp den Code unten ein.'
        : n === 'NotReadableError' ? 'Die Kamera wird gerade von einer anderen App verwendet.'
        : !navigator.onLine && !SCAN.detector ? 'Für das erste Scannen braucht es einmal Internet.' : 'Die Kamera konnte nicht starten.');
    } finally { starting = false; }
  };
  // Nur den sichtbaren Rahmen auswerten: schneller und es wird nicht der Nachbarartikel erkannt
  const grab = () => {
    const vw = video.videoWidth, vh = video.videoHeight, bw = video.clientWidth, bh = video.clientHeight;
    if (!vw || !vh || !bw || !bh) return false;
    const k = Math.max(bw / vw, bh / vh), sw = bw / k, sh = bh / k;
    const x = (vw - sw) / 2 + sw * 0.07, y = (vh - sh) / 2 + sh * 0.2, w = sw * 0.86, h = sh * 0.6;
    const f = Math.min(1, 1000 / w);
    canvas.width = Math.round(w * f); canvas.height = Math.round(h * f);
    ctx.drawImage(video, x, y, w, h, 0, 0, canvas.width, canvas.height);
    return true;
  };
  const tick = async () => {
    timer = null;
    if (!alive()) { stop(); return; }
    if (!st.paused && SCAN.detector && video.readyState >= 2 && grab()) {
      try {
        const found = await SCAN.detector.detect(canvas);
        const hit = found.map(b => normCode(b.rawValue, b.format)).find(Boolean), now = Date.now();
        // Derselbe Code zählt erst wieder, wenn er kurz aus dem Bild war
        if (hit && !st.paused) { if (hit !== st.last || now - st.lastSeen > 1500) { st.last = hit; st.lastSeen = now; handle(hit); } else st.lastSeen = now; }
      } catch(e) {}
    }
    if (alive() && SCAN.stream) timer = setTimeout(tick, 120);
  };
  const flash = () => {
    if (navigator.vibrate) navigator.vibrate(40);
    const cam = root.querySelector('#cam'); if (cam) { cam.classList.add('hit'); setTimeout(() => cam.classList.remove('hit'), 450); }
  };

  const handle = async c => {
    flash();
    if (st.mode === 'assign') { assign(c); return; }
    const a = findByCode(c);
    if (a) { act(a.id, c); return; }
    st.paused = true; st.panel = {kind: 'unknown', code: c, loading: true, q: ''}; panel();
    const info = await lookupCode(c);
    if (st.panel && st.panel.code === c) { st.panel.loading = false; st.panel.info = info; st.panel.offline = !info && !navigator.onLine; panel(); }
  };
  const act = (id, c) => {
    const a = S.articles[id]; if (!a) return;
    const e = (a.codes || []).find(x => x.c === c), size = e && e.size ? e.size : undefined;
    if (st.mode === 'look') { leave(() => openEdit(id)); return; }
    if (st.mode === 'use') {
      if (total(a) <= 0) { st.panel = {kind: 'done', id, code: c, text: 'ist schon leer'}; panel(); return; }
      let sz = size;
      if (sz !== undefined && !(a.lots || []).some(l => (l.size || 0) === sz)) sz = undefined;
      if (sz === undefined && sizeGroups(a).size > 1) { leave(() => consumeOne(id)); return; } // fragt nach der Größe
      const r = consumeOne(id, sz, true);
      st.panel = {kind: 'done', id, code: c, text: isFlag(a) ? 'als aus gemeldet, steht auf der Liste' : a.mode === 'level' ? 'etwas verbraucht' : '1 verbraucht', undo: r && r.undo}; panel(); return;
    }
    const before = clone(a), n = clone(a), q = e && e.q > 1 ? e.q : 1;
    addStock(n, q, size); putArticle(n);
    st.panel = {kind: 'done', id, code: c, before, text: isFlag(n) ? 'ist wieder da' : qtyUnit(q, unitOf(n)) + ' dazu', undo: undoAdd(id, before)}; panel();
  };
  // Rückgängig nimmt nur den Bestand zurück, die Menge pro Scan bleibt
  const undoAdd = (id, before) => () => putArticle({...clone(before), codes: clone((S.articles[id] || before).codes || [])});
  // „Ein Scan zählt“ ändern: den gerade gebuchten Scan gleich mit korrigieren
  const setCount = (p, d) => {
    const cur = S.articles[p.id], e = cur && (cur.codes || []).find(x => x.c === p.code); if (!e) return;
    const q = Math.max(1, (e.q || 1) + d); if (q === (e.q || 1)) return;
    const n = clone(p.before);
    n.codes = clone(cur.codes).map(x => x.c === p.code ? {...x, q} : x);
    addStock(n, q, e.size || undefined); putArticle(n);
    p.text = qtyUnit(q, unitOf(n)) + ' dazu'; p.undo = undoAdd(p.id, p.before);
    panel();
  };
  const assign = async c => {
    const tgt = S.articles[opts.assignTo]; if (!tgt) { close(); return; }
    const other = findByCode(c);
    if (other && other.id === tgt.id) { toast('Diesen Barcode kennt ' + tgt.name + ' schon'); leave(() => openEdit(tgt.id)); return; }
    st.paused = true;
    if (other && !(st.panel && st.panel.kind === 'taken' && st.panel.code === c)) { st.panel = {kind: 'taken', code: c, other: other.id}; panel(); return; }
    st.panel = {kind: 'saving', code: c}; panel();
    const info = await lookupCode(c);
    if (!alive()) return;
    const n = attachCode(clone(S.articles[tgt.id]), c, info && info.size, infoLabel(info), info && info.count);
    putArticle(n); toast('Barcode bei ' + n.name + ' gemerkt');
    leave(() => openEdit(tgt.id));
  };
  const link = (id, c, info) => {
    const n = attachCode(clone(S.articles[id]), c, info && info.size, infoLabel(info), info && info.count);
    putArticle(n); learn(n);
    st.paused = false; st.lastSeen = Date.now();
    if (st.mode === 'look') { toast('Barcode bei ' + n.name + ' gemerkt'); leave(() => openEdit(id)); return; }
    act(id, c);
  };

  const matchRows = list => list.map(a => '<div class="lot"><div class="l">' + esc(a.name) + '<small>' + esc(stockText(a)) + (a.loc ? ', ' + esc(a.loc) : '') + '</small></div><button type="button" class="btn ghost" data-link="' + a.id + '">Das ist es</button></div>').join('');
  const findList = p => {
    const q = norm(p.q);
    const list = q ? Object.values(S.articles).filter(a => norm(a.name).includes(q)).sort((x, y) => x.name.localeCompare(y.name, 'de', {numeric: true})).slice(0, 6)
                   : p.info ? articleMatches(p.info.name, 4) : [];
    return list.length ? matchRows(list) : (q ? '<p class="hint" style="margin:6px 0 0">Kein Artikel mit „' + esc(p.q) + '“.</p>' : '');
  };
  const panel = () => {
    const el = root.querySelector('#scanPanel'); if (!el) return;
    const p = st.panel;
    if (!p) { el.innerHTML = '<p class="hint">' + esc(SCAN_HINT[st.mode]) + '</p>'; return; }
    if (p.kind === 'done') {
      const a = S.articles[p.id]; if (!a) { st.panel = null; panel(); return; }
      const e = (a.codes || []).find(x => x.c === p.code);
      el.innerHTML = '<div class="scanbox"><div class="sumline"><b>' + esc(a.name) + '</b><span class="hint">' + esc(p.text) + '</span></div><p class="hint">Jetzt: ' + esc(stockText(a)) + '</p>' +
        (p.before && e ? '<div class="actions" style="margin:0 0 4px"><span class="hint" style="margin:0">Ein Scan zählt</span><div class="stepper"><button type="button" id="sqMinus" aria-label="weniger pro Scan">−</button><span>' + esc(qtyUnit(e.q || 1, unitOf(a))) + '</span><button type="button" id="sqPlus" aria-label="mehr pro Scan">+</button></div></div>' : '') +
        '<div class="actions">' + (st.mode !== 'use' || total(a) > 0 ? '<button type="button" class="btn ghost" id="sAgain">' + (p.before ? 'Noch mal' : 'Noch 1') + '</button>' : '') + (p.undo ? '<button type="button" class="btn quiet" id="sUndo">Rückgängig</button>' : '') + '<button type="button" class="btn quiet" id="sOpen">Öffnen</button></div></div>';
      const ag = el.querySelector('#sAgain'); if (ag) ag.onclick = () => act(p.id, p.code);
      const qm = el.querySelector('#sqMinus'); if (qm) { qm.onclick = () => setCount(p, -1); el.querySelector('#sqPlus').onclick = () => setCount(p, 1); }
      const ud = el.querySelector('#sUndo'); if (ud) ud.onclick = () => { p.undo(); st.panel = null; st.lastSeen = Date.now(); panel(); };
      el.querySelector('#sOpen').onclick = () => leave(() => openEdit(p.id));
      return;
    }
    if (p.kind === 'saving') { el.innerHTML = '<div class="scanbox"><p class="hint">Barcode ' + esc(p.code) + ' wird gemerkt …</p></div>'; return; }
    if (p.kind === 'taken') {
      const o = S.articles[p.other], t = S.articles[opts.assignTo];
      el.innerHTML = '<div class="scanbox"><p>Dieser Barcode gehört schon zu <b>' + esc(o ? o.name : '?') + '</b>.</p><div class="actions"><button type="button" class="btn" id="sMove">Zu ' + esc(t ? t.name : '') + ' verschieben</button><button type="button" class="btn quiet" id="sSkip">Weiter scannen</button></div></div>';
      el.querySelector('#sMove').onclick = () => assign(p.code);
      el.querySelector('#sSkip').onclick = resume;
      return;
    }
    // Unbekannter Barcode
    const head = '<div class="sumline"><b>' + (p.info ? esc(p.info.name) : 'Unbekannter Barcode') + '</b><span class="hint">' + esc(p.code) + '</span></div>';
    const sub = p.loading ? 'Suche bei Open Food Facts …'
      : p.info ? [p.info.brand, (p.info.count ? p.info.count + (p.info.size ? ' × ' + fmtAmount(p.info.size.v, p.info.size.base) : ' Stk') : p.info.size ? fmtAmount(p.info.size.v, p.info.size.base) : '')].filter(Boolean).join(', ') || 'Gefunden bei Open Food Facts'
      : p.offline ? 'Offline, nachschlagen geht gerade nicht.' : 'In Open Food Facts nicht gefunden.';
    el.innerHTML = '<div class="scanbox">' + head + '<p class="hint">' + esc(sub) + '</p>' +
      (p.loading ? '' :
        '<div class="actions"><button type="button" class="btn" id="sNew">Neu anlegen</button><button type="button" class="btn quiet" id="sSkip">Weiter scannen</button></div>' +
        (Object.keys(S.articles).length ? '<div class="field" style="margin-top:14px"><label for="sFind">Oder ist es etwas, das du schon hast?</label><input type="text" id="sFind" placeholder="Artikel suchen" autocomplete="off" enterkeyhint="search" value="' + esc(p.q) + '"><div id="sList">' + findList(p) + '</div></div>' : '')) +
      '</div>';
    if (p.loading) return;
    el.querySelector('#sSkip').onclick = resume;
    el.querySelector('#sNew').onclick = () => leave(() => openNew(p.info ? p.info.name : '', {code: p.code, size: p.info && p.info.size, count: p.info && p.info.count, codeName: infoLabel(p.info), after: () => openScanner()}));
    const fi = el.querySelector('#sFind'), sl = el.querySelector('#sList');
    if (fi) {
      fi.addEventListener('input', () => { p.q = fi.value; sl.innerHTML = findList(p); });
      sl.addEventListener('click', e => { const b = e.target.closest('[data-link]'); if (b) link(b.dataset.link, p.code, p.info); });
    }
  };

  function shell(){
    const tgt = opts.assignTo && S.articles[opts.assignTo];
    root.innerHTML = '<div class="grip"></div><div class="sheet-head"><h2 class="pick-title">' + (tgt ? 'Barcode für ' + esc(tgt.name) : 'Scannen') + '</h2><button class="xbtn" id="close" aria-label="Schließen">×</button></div>' +
      (tgt ? '' : '<div class="seg" style="margin-top:4px">' + SCAN_MODES.map(([k, l]) => '<button type="button" data-smode="' + k + '" aria-pressed="' + (st.mode === k) + '">' + l + '</button>').join('') + '</div>') +
      '<div class="cam" id="cam"><video playsinline muted autoplay></video><div class="cam-frame" aria-hidden="true"></div><div class="cam-msg" id="camMsg"></div><button type="button" class="cam-torch" id="torch" hidden aria-pressed="false">Licht</button></div>' +
      '<div id="scanPanel"></div>' +
      '<form class="addbar" id="codeForm" autocomplete="off"><input id="codeIn" inputmode="numeric" placeholder="Code eintippen" aria-label="Barcode eintippen" enterkeyhint="search"><button class="btn ghost" type="submit">Suchen</button></form>';
    video = root.querySelector('video'); video.muted = true;
    canvas = document.createElement('canvas'); ctx = canvas.getContext('2d', {willReadFrequently: true});
    root.querySelector('#close').onclick = close;
    root.querySelectorAll('[data-smode]').forEach(b => b.onclick = () => {
      st.mode = UI.scanMode = b.dataset.smode;
      root.querySelectorAll('[data-smode]').forEach(x => x.setAttribute('aria-pressed', x === b));
      if (!st.panel || st.panel.kind === 'done') st.panel = null;
      panel();
    });
    root.querySelector('#codeForm').addEventListener('submit', e => {
      e.preventDefault();
      const inp = root.querySelector('#codeIn'), raw = inp.value.replace(/\D/g, '');
      if (!raw) return;
      const c = normCode(raw, raw.length === 8 && !validCode(raw) ? 'upc_e' : '');
      if (!c) { toast('Dieser Code stimmt nicht. Tippfehler?'); return; }
      inp.value = ''; inp.blur(); st.last = c; st.lastSeen = Date.now(); handle(c);
    });
    panel();
    start();
  }
  const onVis = () => {
    if (!alive()) { document.removeEventListener('visibilitychange', onVis); return; }
    if (document.hidden) stop(); else start();
  };
  document.addEventListener('visibilitychange', onVis);
  openSheet(shell);
  shell.refresh = () => { if (alive() && st.panel && st.panel.kind === 'done') panel(); };
}

/* Zutat zuordnen: liegt als zweites Blatt über dem offenen (Rezept, Gericht, Wunsch), damit dort nichts
   verloren geht. Hier wird festgelegt, welche Vorratsartikel für die Zutat zählen, ein fehlender Artikel
   angelegt oder die Zutat aus dem Vorrat genommen („nicht im Vorrat führen“, etwa Wasser). Nicht für Kinder. */
function openIngLink(name){
  if (kid()) return;
  const sub = $('#subInner');
  const cap = t => t ? t[0].toUpperCase() + t.slice(1) : t;
  let q = '', newName = cap(name.trim()), newCat = guess(name).cat || '';
  const refreshHost = () => { const ta = document.getElementById('r-ing'); if (ta) ta.dispatchEvent(new Event('input')); };
  const close = () => { sub.hidden = true; refreshHost(); const f = $('#sheetInner').querySelector('[data-ing]'); if (f) f.focus({preventScroll: true}); };
  const change = (val, msg) => { const undo = setLink(name, val); refreshHost(); build(); toast(msg, () => { undo(); refreshHost(); if (!sub.hidden) build(); }); };
  const ids = () => { const {arts, how} = ingArticles(name); return how === 'none' ? [] : arts.map(a => a.id); };
  const hits = () => {
    const box = sub.querySelector('#sub-hits'); if (!box) return;
    const have = new Set(ids()), n = norm(q);
    let list;
    if (n) list = Object.values(S.articles).filter(a => !have.has(a.id) && norm(a.name).includes(n));
    else {
      // Ohne Suchbegriff: Artikel, die ein Wort mit der Zutat teilen
      const ws = norm(name).split(' ').filter(w => w.length >= 3).map(stem);
      list = Object.values(S.articles).filter(a => !have.has(a.id) && norm(a.name).split(' ').some(w => ws.some(x => stem(w).includes(x) || x.includes(stem(w)))));
    }
    list = list.sort((x, y) => (norm(y.name).startsWith(n) - norm(x.name).startsWith(n)) || x.name.localeCompare(y.name, 'de')).slice(0, 8);
    box.innerHTML = list.length ? '<div class="list" style="margin-top:8px">' + list.map(a => '<button type="button" class="meal" data-ladd="' + a.id + '"><span class="dot' + (total(a) > 0 ? ' ok' : '') + '"></span><span class="minfo"><span class="name">' + esc(a.name) + '</span><span class="meta">' + esc(stockText(a) + (a.loc ? ', ' + a.loc : '')) + '</span></span></button>').join('') + '</div>'
      : (n ? '<p class="hint" style="margin-top:8px">Nichts gefunden. Unten kannst du es neu anlegen.</p>' : '');
    box.querySelectorAll('[data-ladd]').forEach(b => b.onclick = () => { const a = S.articles[b.dataset.ladd]; q = ''; change([...ids(), a.id], name + ': ' + a.name + ' zählt jetzt dazu'); });
  };
  const build = () => {
    const {arts, how} = ingArticles(name);
    const cats = [...S.meta.cats];
    if (newCat && !cats.includes(newCat)) cats.push(newCat);
    sub.innerHTML = '<div class="grip"></div><div class="sheet-head"><h2 class="pick-title">' + esc(cap(name)) + '</h2><button class="xbtn" id="sub-close" aria-label="Zurück zum Rezept">×</button></div>' +
      (how === 'none' ? '<p class="hint" style="margin:0">Wird nicht im Vorrat geführt und fehlt deshalb nie.</p><div class="actions"><button type="button" class="btn ghost" id="sub-track">Doch im Vorrat führen</button></div>'
      : '<p class="hint" style="margin:0">Was im Vorrat für diese Zutat zählt. Rezepte rechnen mit allem hier zusammen, beim Kochen wird der Reihe nach ausgetragen, nachgekauft wird das Erste.</p>' +
        '<div class="field"><span class="lbl">Zählt dazu</span>' + (arts.length ? '<div class="list">' + arts.map((a, i) => '<div class="lot tagrow"><div class="l">' + esc(a.name) + '<small>' + esc(stockText(a) + (how === 'auto' ? ', automatisch erkannt' : i === 0 && arts.length > 1 ? ', wird nachgekauft' : '')) + '</small></div>' +
            (how === 'auto' ? '<button type="button" class="btn ghost" data-lkeep="' + a.id + '">Passt</button>' : i > 0 ? '<button type="button" class="xbtn" data-lup="' + a.id + '" aria-label="' + esc(a.name) + ' nach vorne (wird dann nachgekauft)">' + UP + '</button>' : '') +
            '<button type="button" class="xbtn" data-ldel="' + a.id + '" aria-label="' + esc(a.name) + (how === 'auto' ? ' passt nicht' : ' entfernen') + '">×</button></div>').join('') + '</div>'
          : '<p class="hint" style="margin:0">Noch nichts. Such unten einen Artikel aus oder leg ihn neu an.</p>') + '</div>' +
        '<div class="field"><label for="f-lq">Aus dem Vorrat dazunehmen</label><input type="search" id="f-lq" class="search" style="margin-top:0" placeholder="Artikel suchen" autocomplete="off" value="' + esc(q) + '"><div id="sub-hits"></div></div>' +
        '<div class="field"><span class="lbl">Neu im Vorrat anlegen</span><div class="two"><input type="text" id="f-lnew" value="' + esc(newName) + '" autocomplete="off" aria-label="Name des neuen Artikels"><select id="f-lcat" aria-label="Kategorie"><option value="">ohne Kategorie</option>' + cats.map(c => '<option' + (c === newCat ? ' selected' : '') + '>' + esc(c) + '</option>').join('') + '</select></div>' +
          '<div class="actions"><button type="button" class="btn" id="sub-create">Anlegen und zuordnen</button></div><div class="hint">Der Artikel ist danach leer. Fehlt er für ein geplantes Gericht, kommt er auf die Einkaufsliste. Feinheiten wie Packungsgröße stellst du später im Vorrat ein.</div></div>' +
        '<div class="sheet-foot"><button type="button" class="btn quiet" id="sub-none">Nicht im Vorrat führen</button>' + (how === 'link' ? '<button type="button" class="btn quiet" id="sub-auto">Automatisch zuordnen</button>' : '<span></span>') + '</div>');
    sub.querySelector('#sub-close').onclick = close;
    const tr = sub.querySelector('#sub-track'); if (tr) tr.onclick = () => change(null, name + ' wird wieder im Vorrat geführt');
    const nn = sub.querySelector('#sub-none'); if (nn) nn.onclick = () => change('none', name + ' wird nicht im Vorrat geführt');
    const au = sub.querySelector('#sub-auto'); if (au) au.onclick = () => change(null, name + ': wieder automatisch');
    sub.querySelectorAll('[data-lkeep]').forEach(b => b.onclick = () => change([b.dataset.lkeep], name + ': ' + S.articles[b.dataset.lkeep].name + ' fest zugeordnet'));
    sub.querySelectorAll('[data-ldel]').forEach(b => b.onclick = () => { const a = S.articles[b.dataset.ldel]; change(ids().filter(x => x !== b.dataset.ldel), name + ': ' + (a ? a.name : 'Artikel') + ' zählt nicht mehr dazu'); });
    sub.querySelectorAll('[data-lup]').forEach(b => b.onclick = () => { const l = ids(), i = l.indexOf(b.dataset.lup); if (i > 0) { [l[i - 1], l[i]] = [l[i], l[i - 1]]; change(l, S.articles[b.dataset.lup].name + ' wird jetzt nachgekauft'); } });
    const qEl = sub.querySelector('#f-lq');
    if (qEl) qEl.addEventListener('input', () => { q = qEl.value; hits(); });
    const ln = sub.querySelector('#f-lnew'), lc = sub.querySelector('#f-lcat');
    if (ln) ln.addEventListener('input', () => { newName = ln.value; });
    if (lc) lc.addEventListener('change', () => { newCat = lc.value; });
    const cr = sub.querySelector('#sub-create');
    if (cr) cr.onclick = () => {
      const nm = (ln.value || '').trim(); if (!nm) { ln.focus(); return; }
      const ex = findByName(nm);
      if (ex) { if (!ids().includes(ex.id)) change([...ids(), ex.id], ex.name + ' gibt es schon, zählt jetzt dazu'); else toast(ex.name + ' zählt schon dazu'); return; }
      const a = newArticle(nm); a.cat = lc.value; putArticle(a);
      change([...ids(), a.id], a.name + ' angelegt und zugeordnet');
    };
    hits();
  };
  build();
  sub.hidden = false;
  sub.scrollTop = 0;
}

/* ============ Schnell verbrauchen ============
   Ein Blatt mit sofort aktiver Suche; ohne Suchbegriff stehen oben die Artikel, die zuletzt und am häufigsten
   verbraucht wurden. Grundlage: der Verlauf des Haushalts (log, 60 Tage) und, für Füllstände und Öffnen, die
   letzten Griffe auf diesem Gerät (haushoed:recentUse). Ein Tipp zieht 1 ab bzw. meldet „knapp“ oder „aus“. */
const RECENT_KEY = 'haushoed:recentUse';
function noteUse(id){
  try {
    const list = (JSON.parse(localStorage.getItem(RECENT_KEY)) || []).filter(x => x[0] !== id);
    list.unshift([id, Date.now()]);
    localStorage.setItem(RECENT_KEY, JSON.stringify(list.slice(0, 40)));
  } catch(e) {}
}
function usualSuspects(max){
  const score = {}, cut = addDays(today(), -60), now = Date.now();
  for (const [m, doc] of Object.entries(S.log)) {
    if (m < cut.slice(0, 7)) continue;
    for (const ev of doc.events || []) if (ev.t === 'use' && ev.a && ev.d >= cut) score[ev.a] = (score[ev.a] || 0) + 1 + (daysUntil(ev.d) >= -7 ? 1 : 0);
  }
  let recent = []; try { recent = JSON.parse(localStorage.getItem(RECENT_KEY)) || []; } catch(e) {}
  // Was du selbst gerade erst genommen hast, steht weit oben: bis 3 Tage alt deutlich, danach schwächer
  for (const [id, t] of recent) { const d = (now - t) / 864e5; score[id] = (score[id] || 0) + (d < 3 ? 6 : d < 14 ? 2 : 0.5); }
  return Object.entries(score).map(([id, sc]) => [S.articles[id], sc]).filter(([a]) => a && usable(a))
    .sort((x, y) => y[1] - x[1] || x[0].name.localeCompare(y[0].name, 'de')).slice(0, max).map(([a]) => a);
}
const usable = a => isFlag(a) ? flagState(a) !== 'out' : total(a) > 0;
function quickRow(a){
  const btns = isFlag(a)
    ? (a.low ? '' : '<button type="button" class="btn ghost" data-qflag="' + a.id + '" data-to="low">Knapp</button>') + '<button type="button" class="btn ghost" data-qflag="' + a.id + '" data-to="out">Aus</button>'
    : (canOpen(a) ? '<button type="button" class="btn ghost" data-qopen="' + a.id + '">Öffnen</button>' : '') +
      '<button type="button" class="qbtn' + (a.openable ? ' openable' : '') + '" data-quse="' + a.id + '" aria-label="' + esc(a.name) + ': ' + (a.mode === 'level' ? 'etwas' : 'eins') + ' verbraucht">−</button>';
  return '<div class="lot qrow"><div class="l">' + esc(a.name) + '<small>' + esc(stockText(a)) + (a.loc ? ', ' + esc(a.loc) : '') + '</small></div>' + btns + '</div>';
}
function openQuickUse(){
  const root = $('#sheetInner');
  let q = '';
  const shell = () => {
    root.innerHTML = '<div class="grip"></div><div class="sheet-head"><h2 class="pick-title">Verbraucht</h2><button class="xbtn" id="close" aria-label="Schließen">×</button></div>' +
      '<div class="searchrow"><input class="search" id="qu-q" type="search" placeholder="Was hast du verbraucht?" autocomplete="off" enterkeyhint="search" aria-label="Artikel suchen"><button class="iconbtn" id="qu-scan" aria-label="Barcode scannen">' + SCAN_ICON + '</button></div>' +
      '<div id="qu-list"></div>';
    const qEl = root.querySelector('#qu-q');
    qEl.value = q;
    qEl.addEventListener('input', () => { q = qEl.value; list(); });
    root.querySelector('#close').onclick = closeSheet;
    root.querySelector('#qu-scan').onclick = () => { UI.scanMode = 'use'; openScanner(); };
    list();
    setTimeout(() => { if (UI.sheet === shell) qEl.focus(); }, 260);
  };
  const list = () => {
    const box = root.querySelector('#qu-list'); if (!box) return;
    const n = norm(q);
    let html;
    if (!n) {
      const sus = usualSuspects(12);
      html = sus.length ? '<h3 class="weekhead" style="margin-top:14px;border:0;padding:0">Zuletzt und oft</h3><div class="list" style="margin-top:6px">' + sus.map(quickRow).join('') + '</div>'
        : '<p class="hint" style="margin-top:12px">Tipp den Namen ein. Was ihr oft verbraucht, steht mit der Zeit von selbst hier.</p>';
    } else {
      const hits = Object.values(S.articles).filter(a => norm(a.name).includes(n));
      const ok = hits.filter(usable).sort((x, y) => norm(y.name).startsWith(n) - norm(x.name).startsWith(n) || x.name.localeCompare(y.name, 'de')).slice(0, 20);
      const empty = hits.filter(a => !usable(a)).length;
      html = ok.length ? '<div class="list" style="margin-top:12px">' + ok.map(quickRow).join('') + '</div>' : '<p class="hint" style="margin-top:12px">' + (empty ? 'Nichts davon ist gerade da.' : 'Nichts gefunden.') + '</p>';
      if (ok.length && empty) html += '<p class="hint" style="margin-top:6px">' + empty + (empty === 1 ? ' weiterer Treffer ist' : ' weitere Treffer sind') + ' gerade leer.</p>';
    }
    box.innerHTML = html;
    box.querySelectorAll('[data-quse]').forEach(b => b.onclick = () => consumeOne(b.dataset.quse));
    box.querySelectorAll('[data-qopen]').forEach(b => b.onclick = () => openOne(b.dataset.qopen));
    box.querySelectorAll('[data-qflag]').forEach(b => b.onclick = () => setFlag(b.dataset.qflag, b.dataset.to));
  };
  openSheet(shell);
  // Neu zeichnen nur die Liste, damit die Suche ihren Fokus behält
  shell.refresh = () => list();
}

/* ============ Snackbar ============ */
let snackTimer;
function toast(msg, undo){
  const sn = $('#snack'); sn.classList.remove('drag'); sn.style.transform = ''; sn.style.opacity = '';
  $('#snackMsg').textContent = msg;
  const b = $('#snackUndo'); b.hidden = !undo;
  b.onclick = () => { if (undo) undo(); $('#snack').classList.remove('show'); };
  $('#snack').classList.add('show');
  sn.dataset.ms = undo ? 5000 : 2600;
  clearTimeout(snackTimer); snackTimer = setTimeout(() => sn.classList.remove('show'), +sn.dataset.ms);
}

// Meldung zur Seite wischen schließt sie
(() => {
  const sn = $('#snack'); let d = null;
  const hideLater = ms => { clearTimeout(snackTimer); snackTimer = setTimeout(() => sn.classList.remove('show'), ms); };
  sn.addEventListener('pointerdown', e => {
    if (!sn.classList.contains('show')) return;
    d = {x: e.clientX, y: e.clientY, dx: 0, id: e.pointerId, moved: false};
    clearTimeout(snackTimer);
  });
  sn.addEventListener('pointermove', e => {
    if (!d || e.pointerId !== d.id) return;
    d.dx = e.clientX - d.x;
    if (!d.moved) {
      if (Math.abs(d.dx) < 8) return;
      if (Math.abs(e.clientY - d.y) > Math.abs(d.dx)) { d = null; hideLater(+sn.dataset.ms || 2600); return; }   // eher senkrecht: kein Wischen
      d.moved = true; sn.classList.add('drag'); try { sn.setPointerCapture(d.id); } catch(err) {}
    }
    sn.style.transform = 'translate(calc(-50% + ' + d.dx + 'px), 0)';
    sn.style.opacity = String(Math.max(0.15, 1 - Math.abs(d.dx) / 220));
  });
  const end = () => {
    if (!d) return;
    const {dx, moved} = d; d = null;
    sn.classList.remove('drag');
    if (!moved) { hideLater(+sn.dataset.ms || 2600); return; }
    if (Math.abs(dx) > 70) {
      sn.style.transform = 'translate(calc(-50% + ' + (dx > 0 ? innerWidth : -innerWidth) + 'px), 0)'; sn.style.opacity = '0';
      sn.classList.remove('show');
      setTimeout(() => { if (!sn.classList.contains('show')) { sn.classList.add('drag'); sn.style.transform = ''; sn.style.opacity = ''; void sn.offsetWidth; sn.classList.remove('drag'); } }, 220);
    } else { sn.style.transform = ''; sn.style.opacity = ''; hideLater(+sn.dataset.ms || 2600); }
  };
  sn.addEventListener('pointerup', end); sn.addEventListener('pointercancel', end);
  // Nach einem Wisch nicht versehentlich „Rückgängig“ auslösen
  sn.addEventListener('click', e => { if (sn.style.opacity === '0') e.stopPropagation(); }, true);
})();

/* ============ Ereignisse ============ */
document.querySelector('.tabs').addEventListener('click', e => {
  const t = e.target.closest('[data-tab]'); if (!t) return;
  goTab(t.dataset.tab, TABS.indexOf(t.dataset.tab) - TABS.indexOf(UI.tab));
});
const TABS = [...document.querySelectorAll('.tab')].map(t => t.dataset.tab);
const COOK_VIEWS = ['plan', 'wishes', 'recipes'];
function slideIn(dir){ const v = $('#view'); v.classList.remove('in-l', 'in-r'); void v.offsetWidth; if (dir) v.classList.add(dir > 0 ? 'in-r' : 'in-l'); }
function goTab(tab, dir){
  if (!tab || tab === UI.tab) return;
  UI.tab = tab; window.scrollTo(0, 0); render();
  slideIn(dir);
}
(() => {
  let t0 = null;
  document.addEventListener('touchstart', e => {
    t0 = null;
    if (UI.sheet || e.touches.length !== 1 || !$('#login').hidden) return;
    const el = e.target;
    // Nicht in Bereichen, die selbst seitlich scrollen oder Eingaben annehmen
    if (el.closest('.chips,.sugg,input,textarea,select,.tabs,#sheet,.snack')) return;
    const x = e.touches[0].clientX;
    if (x < 24 || x > innerWidth - 24) return;   // Bildschirmrand gehört der System-Geste
    t0 = {x, y: e.touches[0].clientY, t: Date.now()};
  }, {passive: true});
  document.addEventListener('touchend', e => {
    if (!t0 || UI.sheet) { t0 = null; return; }
    const p = e.changedTouches[0], dx = p.clientX - t0.x, dy = p.clientY - t0.y, dt = Date.now() - t0.t;
    t0 = null;
    if (Math.abs(dx) < 70 || Math.abs(dx) < Math.abs(dy) * 1.8 || dt > 700) return;
    const dir = dx < 0 ? 1 : -1;
    // In „Kochen“ zuerst zwischen Wochenplan, Wünschen und Rezepten, erst am Rand in den nächsten Bereich
    if (UI.tab === 'cook') {
      const j = COOK_VIEWS.indexOf(UI.cookView) + dir;
      if (j >= 0 && j < COOK_VIEWS.length) { UI.cookView = COOK_VIEWS[j]; window.scrollTo(0, 0); render(); slideIn(dir); return; }
    }
    if (kid()) return;
    const i = TABS.indexOf(UI.tab) + dir;
    if (i < 0 || i >= TABS.length) return;
    // Von links kommend beim Wochenplan landen, von rechts kommend bei den Rezepten
    if (TABS[i] === 'cook') UI.cookView = dir > 0 ? COOK_VIEWS[0] : COOK_VIEWS[COOK_VIEWS.length - 1];
    goTab(TABS[i], dir);
  }, {passive: true});
})();
$('#fab').onclick = () => UI.tab !== 'cook' ? openNew() : UI.cookView === 'wishes' ? (myWishes().length >= WISH_MAX ? toast('Du hast schon ' + WISH_MAX + ' Wünsche. Nimm zuerst einen herunter.') : openWishPicker()) : openRecipe(null);
$('#backdrop').onclick = closeSheet;
document.addEventListener('keydown', e => { if (e.key === 'Escape' && UI.sheet) closeSheet(); });
$('#finishBtn').onclick = finishShopping;
/* Langes Drücken auf − bei öffenbaren Artikeln: eine Einheit öffnen statt verbrauchen */
const HOLD = {timer: null, el: null, x: 0, y: 0, fired: null};
function holdCancel(){ clearTimeout(HOLD.timer); HOLD.timer = null; if (HOLD.el) HOLD.el.classList.remove('hold'); HOLD.el = null; }
document.addEventListener('pointerdown', e => {
  const el = e.target.closest('[data-use]'); holdCancel(); HOLD.fired = null;
  if (!el || el.closest('#sheet') || (e.pointerType === 'mouse' && e.button !== 0)) return;
  const a = S.articles[el.dataset.use]; if (!a || !a.openable) return;
  HOLD.el = el; HOLD.x = e.clientX; HOLD.y = e.clientY; el.classList.add('hold');
  HOLD.timer = setTimeout(() => {
    HOLD.timer = null; el.classList.remove('hold'); HOLD.el = null; HOLD.fired = el.dataset.use; HOLD.at = Date.now();
    if (navigator.vibrate) navigator.vibrate(30);
    const cur = S.articles[el.dataset.use]; if (!cur) return;
    if (canOpen(cur)) openOne(cur.id); else toast(cur.name + ': schon alles offen');
  }, 500);
});
document.addEventListener('pointermove', e => { if (HOLD.el && Math.hypot(e.clientX - HOLD.x, e.clientY - HOLD.y) > 10) holdCancel(); });
['pointerup', 'pointercancel'].forEach(t => document.addEventListener(t, () => { if (HOLD.timer) holdCancel(); }));
document.addEventListener('contextmenu', e => { if (e.target.closest('[data-use]')) e.preventDefault(); });
// Im Gericht: „Menge ungeprüft …“ öffnet den Artikel, dort steht „Für Rezepte“
$('#sheetInner').addEventListener('click', e => {
  const b = e.target.closest('[data-fixart]'); if (b && S.articles[b.dataset.fixart]) { openEdit(b.dataset.fixart); return; }
  const g = e.target.closest('[data-ing]'); if (g) openIngLink(g.dataset.ing);
});
document.addEventListener('click', e => {
  const el = e.target.closest('[data-use],[data-refill],[data-open],[data-filter],[data-act],[data-toggle],[data-qty],[data-remove],[data-cookview],[data-meal],[data-addmeal],[data-recipe],[data-vote],[data-wish],[data-togglecat],[data-tagfilter],[data-rsort],[data-flag],[data-rsaved]');
  if (!el || el.closest('#sheet')) return;
  if (HOLD.fired && el.dataset.use === HOLD.fired && Date.now() - HOLD.at < 1500) { HOLD.fired = null; return; }   // war ein langes Drücken
  const d = el.dataset;
  // Leerer Wert ist hier gültig: „Ohne Kategorie“ bzw. „Alle“
  if (kid() && (d.use || d.refill || d.open || d.act === 'scan' || d.act === 'quickuse' || d.act === 'newrecipe' || d.addmeal || d.flag || d.act === 'tags')) return;
  if ('togglecat' in d) { toggleCat(d.togglecat); return; }
  if ('tagfilter' in d) { toggleTagFilter(d.tagfilter); return; }
  if (d.rsort) { setRecipeSort(d.rsort); return; }
  if (d.act === 'rfilter') { openRecipeFilter(); return; }
  if (d.act === 'rclear') { clearFilter(); render(); return; }
  if (d.rsaved) { const sf = mySaved().find(x => x.id === d.rsaved); if (sf) { if (sameFilter(curFilter(), sf)) clearFilter(); else applyFilter(sf); render(); } return; }
  if (d.flag) { setFlag(d.flag, d.to); return; }
  if (d.act === 'quickuse') { openQuickUse(); return; }
  if (d.act === 'tags') { openTagManager(); return; }
  if (d.use) consumeOne(d.use);
  else if (d.refill) { const a = clone(S.articles[d.refill]); addStock(a, a.buy || 1); putArticle(a); toast(a.name + ': ' + fmtNum(a.buy || 1) + ' dazu'); }
  else if (d.open) openEdit(d.open);
  else if (d.filter) { UI.filter = d.filter; render(); }
  else if (d.cookview) { UI.cookView = d.cookview; window.scrollTo(0, 0); render(); }
  else if (d.vote) voteWish(d.vote, +d.v);
  else if (d.wish) openWish(d.wish);
  else if (d.act === 'wishadd') openWishPicker();
  else if (d.meal) openMeal(d.meal);
  else if (d.addmeal) openPicker(d.addmeal);
  else if (d.recipe) openRecipe(d.recipe);
  else if (d.act === 'newrecipe') openRecipe(null);
  else if (d.act === 'new') openNew();
  else if (d.act === 'new-q') openNew(UI.q);
  else if (d.act === 'scan') openScanner();
  else if (d.toggle || d.qty || d.remove) {
    const entry = shopList().find(x => x.id === (d.toggle || d.qty || d.remove)); if (!entry) return;
    if (d.toggle) { const s = materialize(entry); s.done = !entry.done; putShop(s); }
    else if (d.qty) { const s = materialize(entry); s.qty = Math.max(1, (entry.qty || 1) + +d.d); putShop(s); }
    else if (d.remove) {
      if (entry.auto || entry.plan) {
        const skipBefore = clone(S.meta.planSkip || {}), artBefore = entry.art ? clone(S.articles[entry.art.id]) : null, shopBefore = entry.virtual ? null : clone(S.shopping[entry.id]);
        if (entry.plan && entry.planKey) { S.meta.planSkip = {...(S.meta.planSkip || {}), [entry.planKey]: addDays(today(), (S.meta.planDays || 7) - 1)}; saveMeta(); }
        if (entry.art && needsBuy(entry.art)) { const a = clone(entry.art); a.snoozed = true; putArticle(a); }
        if (!entry.virtual) delShop(entry.id);
        toast(entry.name + ' diesmal nicht', () => { S.meta.planSkip = skipBefore; saveMeta(); if (artBefore) putArticle(artBefore); if (shopBefore) putShop(shopBefore); });
      }
      else { const before = clone(S.shopping[entry.id]); delShop(entry.id); toast(entry.name + ' entfernt', () => putShop(before)); }
    }
  }
});

/* ============ Start ============ */
// Kurzbefehle am App-Symbol (manifest „shortcuts“): ?do=use | scan-use | scan-add
const LAUNCH = new URLSearchParams(location.search).get('do');
localLoad();
migrate();
render();
if (LAUNCH) {
  const u = new URL(location.href); u.searchParams.delete('do'); history.replaceState(null, '', u.pathname + (u.search || ''));
  setTimeout(() => {
    if (kid()) return;
    if (LAUNCH === 'use') openQuickUse();
    else if (LAUNCH === 'scan-use' || LAUNCH === 'scan-add') { UI.tab = 'stock'; UI.scanMode = LAUNCH === 'scan-use' ? 'use' : 'add'; render(); openScanner(); }
  }, 50);
}
if ('serviceWorker' in navigator && (location.protocol === 'https:' || location.hostname === 'localhost')) navigator.serviceWorker.register('sw.js').catch(() => {});
initRemote();
</script>
